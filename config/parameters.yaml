# NexBank governed parameters (Day 13). Single source of truth for thresholds and limits, by reference.
# Brief refs: A12.3 p.34 (8 configuration parameters: default, range, owner, change process), A12.2 p.33 (layered immutability),
#   A4.2 p.13 rule 7 (5-minute timeout), A6 pp.16-17 (trigger constants), A2.3 (retrieval targets), A5.4 p.15 (immutable layer).
# Docs: config/system-prompt/README.md, docs/learning-pipeline/overview.md section 3 (update classes U1-U5, exclusions X1-X6),
#   docs/learning-pipeline/ab-testing.md section 11 (approval workflow per A12.3 parameter).
# Validator: tests/templates/validate_templates.py (checks the 8 A12.3 names, default inside range, effective range inside brief range,
#   that every `mirror` below equals the value in the file it names, so two copies cannot drift silently, that no X4 or X5 parameter is
#   marked may_propose, and that the three ESC-condition parameters carry proposal_limits).
#
# How to read this file (decision D-142)
#   governed_parameters : the 8 parameters of A12.3, copied from the brief's table. `default` and `brief_range` are the brief's.
#                         `effective_range` is narrower only where a project decision narrows it (D-56, D-143); it is never wider.
#   project_parameters  : every other threshold the project uses at runtime, collected here by reference. `value` restates the value in
#                         `defined_in`; this file does not change any of them. `status` says where the number comes from:
#                           brief_fixed = stated by the brief (cite); decided = a project decision; proposal = a number the brief does
#                           not give, to be tuned or approved; default = a Day 2-3 working default with no decision ID.
#   by_reference        : parameter families that stay in their home document and are NOT restated here (learning-pipeline gates,
#                         statistics, queue capacity, dashboard alerts). They are listed so that nothing is governed "nowhere".
#   learning            : may_propose = the learning pipeline may file a change proposal (class U3) that then follows the owner's
#                         change process; no = excluded (X4 registry parameters, X5 trigger conditions, rule layer). No value in this
#                         file is ever applied by the pipeline itself: promotion is a human action (D-113).
#   proposal_limits     : D-197 (amends D-171). Three of the eight A12.3 parameters appear inside an ESC trigger condition
#                         (escalation_sentiment_threshold in ESC-004, max_conversation_turns in XTR-06, retrieval_confidence_threshold in
#                         ESC-008). They stay proposable because A12.3 gives each a change process and D-111 defines the workflow. The
#                         exclusion of D-171 covers the structure of ESC conditions and the non-A12.3 thresholds, not these eight. Each of
#                         the three states its owner, the approval a proposal needs and hard bounds that a proposal cannot cross; a
#                         proposal outside `bounds` or larger than `max_step_per_proposal` is rejected at gate G0 before any test runs.
#                         The validator fails if one of the three lacks these fields, and fails if any X4 or X5 parameter (a registry
#                         parameter of config/guardrails.yaml or a constant of config/escalation_rules.yaml) is marked may_propose.
#   No value in this file is a measurement. Nothing here has been run or tuned.

schema_version: "1.0"
status: draft_day13
source: "A12.3 p.34"

# ------------------------------------------------------------------------------------------------ A12.3 governed parameters (8)
governed_parameters:

- name: intent_confidence_threshold
  type: float
  default: 0.70
  brief_range: {min: 0.50, max: 0.95, text: "0.50-0.95"}
  effective_range: {min: 0.50, max: 0.95}
  owner: NLU Team
  change_process: A/B test required
  brief_ref: "A12.3 p.34"
  meaning: "Secondary-layer intent confidence at or above which the agent acts without a clarifying question."
  decisions: [D-06, D-19]
  learning: may_propose
  update_class: U3
  mirrors:
    - {file: config/intents.yaml, path: thresholds.secondary.act}
  used_by: [config/intents.yaml, docs/architecture/nlu-pipeline-overview.md section 3, docs/architecture/dialogue-management.md section 2,
            config/escalation_rules.yaml parameters_ref, config/system-prompt/layer3-dialogue.md]
  notes: "The clarify floor 0.40 (D-06, ESC-003 in A6) and the safety-flow entry 0.50 (D-19) are separate project parameters below; changing this value does not move them."

- name: escalation_sentiment_threshold
  type: float
  default: -0.70
  brief_range: {min: -1.0, max: -0.3, text: "-1.0 to -0.3"}
  effective_range: {min: -1.0, max: -0.3}
  owner: CX Team
  change_process: CEB approval
  brief_ref: "A12.3 p.34; A6 p.16 (ESC-004: sentiment below -0.7 for 2+ consecutive turns)"
  meaning: "Raw sentiment score below which a customer turn counts toward ESC-004."
  decisions: [D-18]
  learning: may_propose
  update_class: U3
  proposal_limits:
    owner: CX Team
    required_approval: "CEB approval (A12.3) and a Risk Committee view (D-58, X5 as amended by D-197); A/B test per D-111"
    bounds: {min: -1.0, max: -0.4}
    max_step_per_proposal: 0.1
    bounds_reason: "The upper bound is esc004_cancel_sentiment_min (-0.40): above it ESC-004 could fire on a score that its own recovery rule would cancel in the same turn. The lower bound is the brief's. A proposal may not leave the brief range."
  mirrors: []
  used_by: [docs/intent-taxonomy/sentiment.md section 5, config/escalation_rules.yaml parameters_ref, docs/escalation/triggers.md]
  notes: "A6 states -0.7 inside the ESC-004 condition itself. Moving this parameter therefore changes a brief trigger and needs the CEB (A12.3) and, by D-58 and X5, a Risk Committee view. It stays proposable within proposal_limits (D-197)."

- name: max_conversation_turns
  type: integer
  default: 25
  brief_range: {min: 10, max: 50, text: "10-50"}
  effective_range: {min: 15, max: 50}
  owner: Product
  change_process: Standard change
  brief_ref: "A12.3 p.34"
  meaning: "Hard ceiling on messages in one conversation (turn unit: one logged customer or agent message, D-119). XTR-06 says what happens at the ceiling."
  decisions: [D-119, D-129, D-143]
  learning: may_propose
  update_class: U3
  proposal_limits:
    owner: Product
    required_approval: "Standard change (A12.3) with the escalation owner confirming the XTR-06 and ESC-010 interplay; A/B test per D-111"
    bounds: {min: 15, max: 50}
    max_step_per_proposal: 5
    bounds_reason: "Effective floor 15 (D-143): the ceiling must not close a conversation before ESC-010 (more than 15 turns without resolution) can fire. XTR-06 requires turn_count above esc010_turns as well, so ESC-010 can never be pre-empted at or above the floor. The ceiling 50 is the brief's."
  mirrors: []
  used_by: [config/escalation_rules.yaml parameters_ref and XTR-06, docs/escalation/triggers.md]
  notes: "Effective floor 15 (D-143, proposal): below it the ceiling would close a conversation before ESC-010 (A6: more than 15 turns without resolution) could fire. The brief's range 10-50 is kept as the outer bound."

- name: session_timeout_minutes
  type: integer
  default: 5
  brief_range: {min: 3, max: 15, text: "3-15"}
  effective_range: {min: 3, max: 5}
  owner: Security
  change_process: RC approval
  brief_ref: "A12.3 p.34; A4.2 p.13 rule 7"
  meaning: "Minutes of customer inactivity after which authentication is dropped and re-authentication is required."
  decisions: [D-05, D-56]
  learning: "no"
  update_class: X4
  mirrors:
    - {file: config/guardrails.yaml, path: parameters.session_timeout_minutes}
  used_by: [config/guardrails.yaml GR-SEC-R7 and GR-SYS-03, docs/guardrails/account-security.md, docs/architecture/dialogue-management.md section 3,
            config/templates/auth.yaml TPL-AUTH-SESSION-TIMEOUT]
  notes: "D-56: A4.2 rule 7 fixes 5 minutes, so the ceiling is 5. The value may be lowered to 3 with Risk Committee approval and never raised, although the A12.3 range reads 3-15."

- name: knowledge_retrieval_top_k
  type: integer
  default: 5
  brief_range: {min: 3, max: 10, text: "3-10"}
  effective_range: {min: 3, max: 10}
  owner: NLU Team
  change_process: A/B test required
  brief_ref: "A12.3 p.34"
  meaning: "Number of re-ranked KB entries returned to the generator."
  decisions: [D-41]
  learning: may_propose
  update_class: U3
  mirrors: []
  used_by: [docs/knowledge-base/retrieval-pipeline.md section 8, config/system-prompt/layer4-knowledge.md]
  notes: "The retrieval latency budget (200 ms p95, A2.3) is a Tier 0 constraint on any experiment with this value (ab-testing.md section 11)."

- name: retrieval_confidence_threshold
  type: float
  default: 0.65
  brief_range: {min: 0.50, max: 0.90, text: "0.50-0.90"}
  effective_range: {min: 0.50, max: 0.90}
  owner: NLU Team
  change_process: A/B test required
  brief_ref: "A12.3 p.34; A2.3 (uncertainty acknowledgment threshold)"
  meaning: "Calibrated relevance of the rank-1 KB entry below which the agent must acknowledge uncertainty; also the evidence floor for citing an entry."
  decisions: [D-43]
  learning: may_propose
  update_class: U3
  proposal_limits:
    owner: NLU Team
    required_approval: "A/B test (A12.3) and Risk Committee review, because ESC-008 reads the value for regulatory topics (safety-invariants.md section 5.1; D-111)"
    bounds: {min: 0.65, max: 0.90}
    max_step_per_proposal: 0.05
    bounds_reason: "A proposal may only keep or raise the default 0.65: lowering the value makes the agent answer on weaker evidence and lets fewer regulatory questions reach ESC-008. Lowering below the default is a Risk Committee decision outside the learning pipeline. The ceiling 0.90 is the brief's."
  mirrors: []
  used_by: [docs/knowledge-base/retrieval-pipeline.md sections 8-9, docs/intent-taxonomy/language-detection.md section 6,
            config/escalation_rules.yaml parameters_ref, config/templates/support.yaml (TPL-KB-DEGRADE, TPL-KB-GAP, TPL-KB-TRANSLATION-UNAVAILABLE)]
  notes: "Same value for every language. ESC-008 reads it for regulatory topics (D-43), so a change is safety-adjacent (safety-invariants.md section 5.1). It stays proposable within proposal_limits (D-197)."

- name: guardrail_strictness_level
  type: enum
  default: HIGH
  brief_range: {values: [MEDIUM, HIGH, CRITICAL], text: "MED/HIGH/CRIT"}
  effective_range: {values: [HIGH, CRITICAL]}
  owner: RC
  change_process: RC approval required
  brief_ref: "A12.3 p.34"
  meaning: "Strictness of the configurable guardrail thresholds."
  decisions: [D-86, D-143]
  learning: "no"
  update_class: X4
  mirrors:
    - {file: config/guardrails.yaml, path: parameters.guardrail_strictness_level}
  used_by: [config/guardrails.yaml GR-SYS-03, docs/guardrails/incident-response-playbook.md lever 6, docs/learning-pipeline/ab-testing.md section 11]
  notes: "The registry and its false-positive budget assume HIGH or above (config/guardrails.yaml parameters). MEDIUM stays in the brief's range but is not a tested configuration: selecting it needs Risk Committee approval and a re-run of the fixed suite (D-143, proposal). Raising to CRITICAL is pre-approved for incidents (D-86). Never an experiment arm."

- name: model_temperature
  type: float
  default: 0.3
  brief_range: {min: 0.0, max: 1.0, text: "0.0-1.0"}
  effective_range: {min: 0.0, max: 1.0}
  owner: ML Team
  change_process: A/B test + RC review
  brief_ref: "A12.3 p.34"
  meaning: "Sampling temperature of the generation model for `hybrid` free slots and `llm-guided` templates. Template-mode text and locked slots are not generated, so the value has no effect on them."
  decisions: [D-144]
  learning: may_propose
  update_class: U3
  mirrors: []
  used_by: [docs/architecture/response-generation.md, config/templates/README.md section 3]
  notes: "A prompt bundle records the temperature it was approved with (config/system-prompt/manifest.yaml)."

