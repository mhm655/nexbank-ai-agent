  escalation: [ESC-001, ESC-009]
  intents: [SEC-003, SEC-001, SEC-002, SEC-004, ACC-003]
  kb_entries: [KB-POL-011, KB-POL-002, KB-TRB-007, KB-TRB-011, KB-REG-003]
  regulatory_tags: [PCI_DSS, DPDP_ACT, RBI_DIGITAL_PAYMENT_SECURITY]
  severity: CRITICAL
  fp_target_pct: 0.1
  immutable: true
  fail_mode: "Input Guard failure: the State Tracker and the log writer run the same redaction patterns (second line), and the Output Safety Layer blocks any echo of a credential"
  tests_reserved: 6
  brief_ref: A4.2
