# ------------------------------------------------------------------ ACCOUNT SECURITY (A4.2 rules 1-8, numbered by order of appearance in the brief)
- id: GR-SEC-R1
  name: Never display, read out or transmit full account, card, CVV, PIN, password or Aadhaar numbers
  family: SEC
  rule_no: 1
  type: rule
  layers: [L1, L4]
  enforcement_points: [input_guard, tool_orchestrator, output_safety_layer, audit_bus]
  action: mask
  also: [block]
  escalation: []
  intents: [ACC-001, ACC-002, CRD-001, CRD-002, CRD-005, SEC-001, SEC-003, TXN-001]
  kb_entries: [KB-POL-002, KB-REG-003, KB-POL-011, KB-TRB-007]
  regulatory_tags: [PCI_DSS, DPDP_ACT, IT_SPDI_RULES]
  severity: CRITICAL
  fp_target_pct: 0.1
  immutable: true
  fail_mode: "validator error or outage: mask the whole numeric run; if the value is a credential the draft is blocked and replaced by the secure-channel template"
  tests_reserved: 6
  brief_ref: A4.2
  doc: account-security.md

- id: GR-SEC-R2
  name: No account modification without the required authentication level
  family: SEC
  rule_no: 2
  type: rule
  layers: [L1]
  enforcement_points: [policy_engine, tool_orchestrator, knowledge_retrieval]
  action: redirect
  also: [block]
  escalation: [ESC-009]
  intents: [ACC-003, ACC-004, ACC-005, ACC-006, ACC-008, TXN-005, CRD-001, CRD-002, CRD-003, SEC-003]
  kb_entries: [KB-POL-003, KB-POL-002, KB-POL-004]
  regulatory_tags: [KYC_AML, RBI_DIGITAL_PAYMENT_SECURITY]
  severity: CRITICAL
  fp_target_pct: 0.1
  immutable: true
  fail_mode: "auth service or token validation unavailable: fail closed, no modification, offer a human; three failed OTP attempts lock the flow (auth-flow.mmd)"
  tests_reserved: 5
  brief_ref: A4.2
  doc: account-security.md

- id: GR-SEC-R3
  name: Never initiate, approve or facilitate a fund transfer, payment or transaction
  family: SEC
  rule_no: 3
  type: hybrid
  layers: [L1, L2, L4]
  enforcement_points: [tool_orchestrator, policy_engine, output_safety_layer]
  action: block
  also: [redirect]
  escalation: [ESC-001, ESC-012]
  intents: [TXN-003, TXN-005, TXN-006, PRD-005]
  kb_entries: [KB-POL-004, KB-POL-002, KB-TRB-003]
  regulatory_tags: [RBI_DIGITAL_PAYMENT_SECURITY, KYC_AML]
  severity: CRITICAL
  fp_target_pct: 0.15
  immutable: true
  fail_mode: "no tool that moves money exists in the registry, so the rule holds even if every classifier fails; the output check catches 'I have sent/paid/transferred' claims"
  tests_reserved: 5
  brief_ref: A4.2
  doc: account-security.md

- id: GR-SEC-R4
  name: No disclosure of one customer's account to another (family and power-of-attorney claims included)
  family: SEC
  rule_no: 4
  type: hybrid
  layers: [L1, L2, L4]
  enforcement_points: [gateway_session_manager, tool_orchestrator, state_tracker, output_safety_layer]
  action: block
  also: [redirect]
  escalation: [ESC-001]
  intents: [ACC-001, ACC-002, TXN-001, CMP-002, GEN-004, SEC-002]
  kb_entries: [KB-POL-010, KB-POL-002]
  regulatory_tags: [DPDP_ACT, KYC_AML]
  severity: CRITICAL
  fp_target_pct: 0.15
  immutable: true
  fail_mode: "customer_id is bound to the authenticated session and injected by the Tool Orchestrator, so a cross-customer query is not expressible; an output draft naming another customer's identifier is blocked and logged as a P0 incident"
  tests_reserved: 5
  brief_ref: A4.2, A11.3
  doc: account-security.md

- id: GR-SEC-R5
  name: Never accept or store credentials; instruct the customer to change compromised ones
  family: SEC
  rule_no: 5
  type: rule
  layers: [L1, L4]
  enforcement_points: [input_guard, state_tracker, audit_bus, response_generator, output_safety_layer]
