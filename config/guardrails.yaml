  regulatory_tags: [RBI_DIGITAL_PAYMENT_SECURITY]
  severity: HIGH
  fp_target_pct: 0.1
  immutable: true
  fail_mode: "session store outage: treat auth as expired and require re-authentication (FMEA #1)"
  tests_reserved: 4
  brief_ref: A4.2, A12.3
  doc: account-security.md

- id: GR-SEC-R8
  name: Detect and refuse social engineering (staff, regulator and law-enforcement impersonation)
  family: SEC
  rule_no: 8
  type: hybrid
  layers: [L1, L2, L3]
  enforcement_points: [input_guard, policy_engine, prompt_layers_0_2]
  action: block
  also: [escalate]
  escalation: [ESC-001]
  intents: [GEN-004, SEC-001, SEC-002, ACC-001, ACC-003]
  kb_entries: [KB-POL-010, KB-POL-002]
  regulatory_tags: [KYC_AML]
