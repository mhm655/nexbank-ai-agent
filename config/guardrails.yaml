# NexBank guardrail registry (Day 9). Machine-readable source of truth for guardrail IDs, types, enforcement points and actions.
# Brief refs: A4.1 (advice), A4.2 (8 account-security rules), A4.3 (regulatory), A4.4 (adversarial, Day 10), A9/A11/A12, Regulatory Reference Summary.
# Docs: docs/guardrails/financial-advice.md, account-security.md, regulatory-mapping.md. Diagram: diagrams/guardrail-layers.mmd.
# Checker (scratchpad, not in repo) verifies: YAML parses; every GR ID in the docs exists here and vice versa; linked intent, ESC and KB IDs exist; 8 security rules present.
#
# ID scheme
#   Guardrail ID : GR-<FAMILY>-<key>   FAMILY = ADV (advice), SEC (account security, key R1..R8 = A4.2 rules 1..8),
#                                      REG (regulatory), OUT (response safety), SYS (cross-cutting), ATK (adversarial robustness, Day 10,
#                                      key = two digits 01..11; each guardrail carries a `vector` field naming the A4.4 vector it serves).
#   Test ID      : <guardrail ID>-<NN>   NN = two digits starting at 01, for example GR-SEC-R1-01 or GR-ATK-05-03. Day 10 writes the cases in
#                  tests/guardrails/ (Day 9 families) and tests/adversarial/ (GR-ATK-*); Day 11 re-uses them in the fixed safety suite.
#                  `tests_reserved` is the number of IDs reserved (01..N); a guardrail may not ship with fewer written cases than 1, and the
#                  Day 10 total must reach the project target of 55+ (the brief asks for 50+, Part D, Day 9-10).
#
# Counts (Day 10): 58 guardrails = ADV 9, SEC 8, REG 20, OUT 6, SYS 4 (Day 9: 45; rule 23, hybrid 20, model 2) + ATK 11 (rule 4, hybrid 6, model 1)
#   + GR-OUT-06 and GR-SYS-04 (rule, added Day 10, D-90); all 58: rule 29, hybrid 26, model 3. Reserved test IDs: 190 = Day 9 124
#   (ADV 30, SEC 40, REG 38, OUT 10, SYS 6) + ATK 62 + GR-OUT-06 2 + GR-SYS-04 2.
#   The 11 ATK guardrails have an fp_target_pct sum of 0.76; the eight that touch every benign message or retrieved passage (01, 02, 03, 05, 06,
#   07, 08, 09) sum to 0.46 and draw on the 0.50 reserve (D-76). Registry total is a count of IDs, not of written cases (tests/README.md).
#
# Escalation triggers owned by the router, not by a guardrail (D-135): ESC-005, ESC-007 and ESC-011 are listed by no guardrail below, so
#   the crisis protocol has no entry in this registry. They are escalation triggers (brief A6), not A4 guardrails, and are owned by the
#   Escalation Router rules in config/escalation_rules.yaml. No guardrail is registered for them: it would exceed the 0.04-point
#   false-positive reserve (D-76), and the Input Guard crisis screen only raises the signal that the ESC-011 router rule consumes.
#
# Action vocabulary (what the guardrail does when it triggers)
#   block     : refuse or stop the request or the draft; nothing about it is executed or delivered
#   redirect  : replace the draft or route the turn to a safe template or flow (information-only wording, auth flow, in-app link)
#   escalate  : hand the conversation to a human queue (ESC IDs in `escalation`) with the handoff package
#   mask      : redact or mask data (placeholder or last-4 form) and continue
# `also` lists secondary actions that always accompany the primary one (log is implicit for every guardrail).
#
# Types: rule (deterministic), model (classifier), hybrid (rule floor plus model; a rule hit can never be unset by the model).
# Layers (system-architecture.md section 5): L1 immutable rule layer, L2 model classifiers, L3 prompt layers 0-2,
#   L4 output verification, L5 fail-closed degradation ladder.
#   The L1-L5 scheme is our own; the brief has no layer scheme (D-93). Tagging rule: a guardrail carries L4 if and only if
#   `output_safety_layer` is among its enforcement points (it executes at the Output Safety Layer, in both directions); model-type guardrails carry L2.
#   GR-ATK-04 flagged-turn sources (D-72, D-91, D-92): hits from GR-ATK-01, 02, 03, 05, 06, 07 and 10 plus adversarial-looking Day 9 refusals.
# Severity follows config/intents.yaml safety_ratings: CRITICAL, HIGH, MEDIUM.
# fp_target_pct: proposed DIAGNOSTIC upper bound ("below") for the false-positive rate on benign traffic that reaches the guardrail (D-57, restated by D-64).
#   It is not the gate. The gate is fp_overall_target_pct, measured end-to-end per benign message (blocked, redirected, escalated or wrongly masked).
#   Class bounds are sized so that a typical path (10 rule + 6 hybrid + 2 model guardrails) sums to 2.5 percent, leaving 0.5 points of reserve
#   (docs/guardrails/financial-advice.md section 10).
# immutable: true for every guardrail (D-58): the learning pipeline can neither edit the rule or threshold nor relax the action. Classifier weights
#   of `model` and `hybrid` guardrails change only through the safety change-control path (HITL, Risk Committee approval, 100% fixed suite), never by learning.

schema_version: "1.0"
registry_status: draft_day10

components:               # system-architecture.md section 2 (12 components) plus the prompt layer
  gateway_session_manager: 1
  input_guard: 2
  nlu_service: 3
  state_tracker: 4
  policy_engine: 5
  knowledge_retrieval: 6
  tool_orchestrator: 7
  escalation_router: 8
  response_generator: 9
  output_safety_layer: 10
  audit_bus: 11
  learning_pipeline: 12
  prompt_layers_0_2: 0

parameters:               # values restated from other docs; governed copy is config/parameters.yaml (Day 13)
  guardrail_strictness_level: HIGH          # A12.3 default; range MEDIUM/HIGH/CRITICAL; Risk Committee approval; this registry assumes HIGH or above
  session_timeout_minutes: 5                # A4.2 rule 7 and A12.3 default
  session_timeout_ceiling_minutes: 5        # proposal D-56: A12.3 range is 3-15 but rule 7 fixes 5; the guardrail value may be lowered to 3, never raised
  advice_boundary_act: 0.50                 # disambiguation.md section 3; flow_entry_overrides PRD-005 in config/intents.yaml
  advice_boundary_flag: 0.30                # disambiguation.md section 3 (adds a boundary sentence)
  grievance_info_max_turns: 2               # A4.3
  fp_overall_target_pct: 3                  # GATE: measured end-to-end per benign message, below 3 percent (FMEA #4, system-architecture.md section 5, D-64)
  fp_class_bounds_pct: { rule: 0.1, hybrid: 0.15, model: 0.3 }   # proposal D-64 (supersedes the D-57 figures 1, 2, 3); diagnostics, not the gate
  fp_typical_path: { rule: 10, hybrid: 6, model: 2 }              # proposal D-64: 10*0.1 + 6*0.15 + 2*0.3 = 2.5 percent
  fp_reserve_pct: 0.5                                             # proposal D-64: 3.0 - 2.5, for the L5 ladder, interactions and unmodelled paths
  # Day 10 adversarial parameters. ALL are proposals (D-69, D-72, D-73, D-74), unmeasured, to be tuned on dev traffic; governed copy is config/parameters.yaml (Day 13).
  atk_decode_depth_max: 2                   # GR-ATK-01: nested encodings decoded for scanning (base64, hex, rot13, URL); deeper content is dropped as data
  atk_adversarial_flags_safe_mode: 3        # GR-ATK-04: distinct flagged turns in one session before templates-only safe mode
  atk_prompt_overlap_words: 8               # GR-ATK-06: consecutive words shared between a draft and prompt layers 0-2 that block the draft
  atk_msgs_per_minute_per_session: 20       # GR-ATK-08: soft limit, then a polite retry message (hard limit is 2x)
  atk_new_sessions_per_hour_per_identity: 10   # GR-ATK-08: sessions opened by one device, customer or network fingerprint
  atk_input_max_chars: 4000                 # GR-ATK-08 (token budget): longer input is truncated for processing and the customer is asked to shorten it
  atk_tool_calls_per_turn: 3                # GR-ATK-09: tool-call budget per customer turn (loop breaker)
  atk_output_max_words: 250                 # GR-ATK-08: cap on one agent reply (token budget expressed in words); templates are far shorter
  atk_conversation_max_turns: 15            # GR-ATK-09: A6 ESC-010 (conversation exceeds 15 turns without resolution); the brief fixes this value. Not the A12.3 ceiling `max_conversation_turns` (25): this is the ESC-010 line, that is the hard cap (config/parameters.yaml registers both)
  atk_safety_intents_exempt_from_soft_limit: [SEC-001, GEN-007, GEN-003]   # D-74: never throttled below the hard limit

guardrails:

