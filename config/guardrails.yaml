  severity: CRITICAL
  fp_target_pct: 0.1
  immutable: true
  fail_mode: "queue unavailable: next queue and callback; a missed trigger is backstopped by the escalation proximity score and replay audits; escalation is never skipped because a model or the customer prefers to continue"
  tests_reserved: 4
  brief_ref: A4.2, A6
  doc: account-security.md

- id: GR-SEC-R7
