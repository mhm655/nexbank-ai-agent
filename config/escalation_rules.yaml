- id: ESC-008
  origin: brief
  brief: {condition: "Regulatory question with uncertain answer", priority: P1, queue: "Compliance Helpdesk", sla: "<10 min", citation: "A6 p.16"}
  condition_text: regulatory question with uncertain answer
  priority: P1
  queue: Compliance Helpdesk
  sla: under 10 min
