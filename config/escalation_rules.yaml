  decisions: [D-125]

- id: ESC-015
  origin: brief
  brief: {condition: "Customer is a Politically Exposed Person (PEP)", priority: P1, queue: "Enhanced Due Diligence", sla: "<5 min", citation: "A6 p.17"}
  condition_text: customer is a Politically Exposed Person
  priority: P1
  queue: Enhanced Due Diligence
  sla: under 5 min
  sla_seconds: 300
  precedence_rank: 5
  cancellable: never
  handoff_mode: discreet
  parallel_case: true
  intent_scope: any
  fire_when: "customer_identified && pep_flag"
  sub_rules:
    - {id: ESC-015.a, when: "customer_identified && pep_flag", source: system, handoff_mode: silent_case, note: "literal reading of A6 (D-164, amends D-126): on every contact by an identified, flagged customer the ESC-015 record is created and the parallel due-diligence case is opened; the customer is never told the flag exists and a customer's own statement never sets or clears it (GR-REG-11)"}
    - {id: ESC-015.b, when: "customer_identified && pep_flag && account_specific", source: system, handoff_mode: discreet, note: "live discreet handoff to Enhanced Due Diligence only when the request is account-specific; a generic information request (action info) is answered by the agent while the case of sub-rule a is open"}
  protective_actions: "no account-specific action by the agent once the flag is read; generic information is still served"
  detectors: [tool_orchestrator, policy_engine, state_tracker]
  owner_component: escalation_router
  state_fields: [auth_level, customer_ref, intent]
  intents: []
  guardrails: [GR-REG-11]
  kb_entries: [KB-ESC-009, KB-ESC-010, KB-REG-004]
  templates: [TPL-ESC-HANDOFF-DISCREET]
  tests: [ESC-T-015-01, ESC-T-015-02, ESC-T-015-03]
  decisions: [D-126, D-164]

# ---------------------------------------------------------------------------------------------------------------- additions
# NOT in the brief. Each rule is marked origin: addition and carries an XTR id so it cannot be mistaken for one of the 15.
# `raises`: the brief trigger whose record is created (priority, queue and SLA are that trigger's).
# `route`: for rules that do not raise a brief trigger, a brief queue used at that queue's own SLA, or `referral` (no live handoff).
extra_rules:

- id: XTR-01
  origin: addition
  name: Customer-requested human handoff before the third request
  basis: "A11.3 p.31: 'Customers must have the right to request human assistance at any point'; KB-ESC-003; boss-trace.md turn 18; GR-REG-16"
  fire_when: "explicit_human_request && human_requests < const.esc006_human_requests"
  raises: null
  route: {priority: P2, queue: Next Available Agent, sla: under 10 min, sla_seconds: 600}
  behaviour: "request 1: handoff preparation starts and the reply may carry one concrete offer to finish the task now; if the customer takes the offer the pending handoff is cancelled, otherwise it proceeds. Request 2: handoff with no counter-offer. Request 3 or more: ESC-006. An implicit request (who can I talk to) is counted and answered with the human option; it starts a handoff only if the customer confirms"
  cancellable: customer_only
  handoff_mode: warm
  intents: [GEN-003, CMP-005]
  guardrails: [GR-REG-16]
  templates: [TPL-ESC-HUMAN-REQUEST-FIRST]
  kb_entries: [KB-ESC-003]
  tests: [XTR-T-01-01, XTR-T-01-02]
  decisions: [D-117]

- id: XTR-02
  origin: addition
  name: Repeated authentication failure
  basis: "D-65 (confirmed on Day 12, D-115); A4.2 rule 2 and rule 6 p.12-13; auth-flow.mmd"
  fire_when: "otp_failures >= prop.otp_failures_lock"
  raises: ESC-009
  route: null
  behaviour: "the challenge locks; no account-specific service in this session; the customer is told calmly that a colleague from the security team will help, with no accusation; sub-rule ESC-009.c"
  cancellable: never
  handoff_mode: warm
  intents: [SEC-003]
  guardrails: [GR-SEC-R2, GR-ATK-10]
  kb_entries: [KB-ESC-002]
  tests: [XTR-T-02-01, XTR-T-02-02]
  decisions: [D-65, D-92, D-115]

- id: XTR-03
  origin: addition
  name: Care flag on an explicit vulnerability disclosure
  basis: "A1.3 p.4 (CEB: accessibility for varying literacy levels); A13.2 persona Meera; KB-ESC-018 hardship_note; A11.3 p.31-32 (no inference or storage of sensitive attributes)"
  fire_when: "care_disclosure"
  raises: null
  route: {priority: P2, queue: Next Available Agent, sla: under 10 min, sla_seconds: 600}
  behaviour: "an offer, not a forced handoff: simpler wording, slower pace, and one offer of a human; the package carries a care note in the customer's own words; no threshold of any brief trigger changes; nothing is inferred from age, language or balance"
  cancellable: customer_only
  handoff_mode: warm
  intents: [PRD-002]
  guardrails: [GR-REG-17]
  templates: [TPL-ESC-CARE-OFFER]
  kb_entries: [KB-ESC-018]
  tests: [XTR-T-03-01, XTR-T-03-02]
  decisions: [D-129]

- id: XTR-04
  origin: addition
  name: Clarification budget exhausted
  basis: "dialogue-management.md section 2 (CLARIFY > ESCALATING at 2 attempts) and section 4.4; A9.2 Robotic Loop p.24"
  fire_when: "clarify_failures >= prop.clarification_failures_handoff"
  raises: null
  route: {priority: P2, queue: General Support, sla: under 10 min, sla_seconds: 600}
  behaviour: "after 2 failed clarifications for the same ambiguity: the pair's safe default if it has one, otherwise a human offer with the gathered context; never a third rephrase request"
  cancellable: customer_or_recovery
  handoff_mode: warm
  intents: []
  guardrails: [GR-SYS-01]
  kb_entries: [KB-ESC-020]
  tests: [XTR-T-04-01, XTR-T-04-02]
  decisions: [D-129]

- id: XTR-05
  origin: addition
  name: Scheduled follow-up deadline missed
  basis: "Case Study 6 turn 6 pp.55-56 ('automatic escalation ... Payments Resolution Team'); A9.1 Pattern 5"
  fire_when: "followup_deadline_missed"
  raises: null
  route: {priority: P2, queue: Dispute Resolution, sla: referral, sla_seconds: null}
  behaviour: "asynchronous: no customer is waiting in chat, so this is a back-office referral with a proactive notification, not a live handoff; it is not counted in the escalation rate (kpi-framework.md KPI-O2); the brief's 'Payments Resolution Team' is not an A6 queue, so the Dispute Resolution queue is used (proposal)"
  cancellable: customer_or_recovery
  handoff_mode: silent_case
  intents: [TXN-003]
  guardrails: []
  kb_entries: [KB-TRB-001]
  tests: [XTR-T-05-01, XTR-T-05-02]
  decisions: [D-129]

- id: XTR-06
  origin: addition
  name: Conversation turn ceiling reached
  basis: "A12.3 p.34 max_conversation_turns (default 25, range 10-50); the brief does not say what happens at the ceiling"
  fire_when: "turn_count >= param.max_conversation_turns && turn_count > const.esc010_turns"
  raises: ESC-010
  route: null
  behaviour: "if a topic is still open the conversation goes to Supervisor Review with the summary; if every topic is resolved the agent closes politely and offers a new conversation, and no record is created"
  cancellable: customer_or_recovery
  handoff_mode: warm
  intents: []
  guardrails: [GR-ATK-09]
  templates: [TPL-GEN-LIMIT-CLOSE]
  kb_entries: [KB-ESC-010]
  tests: [XTR-T-06-01, XTR-T-06-02]
  decisions: [D-119, D-129]

- id: XTR-07
  origin: addition
  name: Intent that needs a human process and fires no brief trigger
  basis: "A3.1 (ACC-005 and ACC-006: Full KYC + Branch); config/intents.yaml action handoff; KB-POL-005"
  fire_when: "intent_requires_human && !(closure_requested && high_value)"
  raises: null
  route: {priority: P2, queue: General Support, sla: referral, sla_seconds: null}
  behaviour: "the agent explains the process, records the reason and opens a referral ticket for the branch or specialist process; it is a referral, not a live escalation; a customer who wants a person now uses XTR-01"
  cancellable: customer_only
  handoff_mode: warm
  intents: [ACC-005, ACC-006]
  guardrails: [GR-SEC-R2]
  templates: [TPL-ACC-CLOSURE-REASON]
  kb_entries: [KB-POL-005]
  tests: [XTR-T-07-01, XTR-T-07-02]
  decisions: [D-129]

# ---------------------------------------------------------------------------------------------------------------- handoff package
# The 8 elements are D-04 and KB-ESC-001, in that order. Field-level schema: docs/escalation/routing-and-handoff.md section 4.
handoff_package:
  elements:
    - {n: 1, name: customer ID (pseudonymised), field: customer_ref, source: state.customer_ref}
    - {n: 2, name: auth level, field: auth, source: "state.auth_level, state.auth_expiry"}
    - {n: 3, name: intent history, field: intent_history, source: "state.topic_stack, state.history[].intent"}
    - {n: 4, name: entities collected, field: entities, source: "state.slots (masked)"}
    - {n: 5, name: conversation summary, field: summary, source: "state.summary.text, state.summary.pinned_facts"}
    - {n: 6, name: sentiment trajectory, field: sentiment, source: "state.sentiment.trajectory, slope, emotions"}
    - {n: 7, name: actions already taken, field: actions_taken, source: state.actions_taken}
    - {n: 8, name: escalation trigger and reason, field: escalation, source: "EscalationDecision: trigger_id, rule_id, secondary triggers, reason codes"}
