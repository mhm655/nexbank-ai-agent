    - {id: ESC-009.b, when: "SEC-003 or SEC-004 where the customer reports a login, device, password or contact-detail change they did not make", source: customer_report}
    - {id: ESC-009.c, when: "otp_failures >= prop.otp_failures_lock", source: system, raised_by: XTR-02, note: "extension of the detection signal (D-65 confirmed, D-115): the brief's wording is 'reported'; a locked challenge is a system-detected suspected access attempt"}
    - {id: ESC-009.d, when: "ato_pattern", source: system, handoff_mode: discreet, note: "KB-TRB-011: credential reset or sensitive request shortly after a contact-details change; the reset link is withheld"}
  protective_actions: "credential reset link to the registered channel only (SEC-003); instruction to change any compromised credential in the same turn (GR-SEC-R5, KB-POL-011)"
