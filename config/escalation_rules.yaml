# NexBank escalation rules (Day 12). Single source of truth for escalation triggers, precedence, queues and SLAs.
# Brief refs: A6 pp.16-17 (the 15 triggers: condition, priority, target queue, SLA), A4.2 rule 6, A4.4 (auto escalation,
# mandatory escalation), A11.3 (thresholds consistent across segments; right to a human at any point), A12.3 (parameters),
# Case Study 2 pp.49-50 (ESC-001), Case Study 3 p.51 (ESC-013 offered), Case Study 5 pp.53-54 (sentiment recovery).
# Docs: docs/escalation/triggers.md, routing-and-handoff.md, queue-management.md. Diagram: diagrams/escalation-routing.mmd.
# Tests: tests/escalation/ (specified, not run). Validator: tests/escalation/validate_escalation.py.
#
# What is the brief's and what is ours:
#   - `brief:` blocks quote A6 verbatim. `condition_text`, `priority`, `queue`, `sla` restate them in the wording of KB-ESC-010.
#   - `fire_when`, `sub_rules`, `precedence_rank`, `cancellable`, `handoff_mode`, queue hours, overflow chains and every
#     value under `proposals:` are design proposals (decisions D-115 to D-134). The brief is silent on them.
#   - `extra_rules` (XTR-01 to XTR-07) are ADDITIONS, not brief triggers. They never add a priority, a queue or an SLA:
#     each one either raises one of the brief's 15 triggers or uses a brief queue at that queue's own SLA.
# Parameters are referenced by their A12.3 names (governed copy: config/parameters.yaml, Day 13). Values are not restated here
# except the constants A6 itself fixes (40%, 3 turns, 2 turns, INR 50,000, 3 requests, 5L, 15 turns).

schema_version: "1.0"
registry_status: draft_day12
source: "A6 pp.16-17"

# ---------------------------------------------------------------------------------------------------------------- priorities
priorities:
  P0: {rank: 0, meaning: "safety, security or compliance critical", pre_empts: [P1, P2], cancellable_by_ai: false, cancellable_by_customer: false}
  P1: {rank: 1, meaning: "specialist or high-stakes handling", pre_empts: [P2], cancellable_by_ai: false, cancellable_by_customer: per_rule}
  P2: {rank: 2, meaning: "general assistance", pre_empts: [], cancellable_by_ai: per_rule, cancellable_by_customer: per_rule}

# ---------------------------------------------------------------------------------------------------------------- parameters
parameters_ref:            # A12.3 names; values live in config/parameters.yaml (Day 13)
  escalation_sentiment_threshold: "A12.3: default -0.70, range -1.0 to -0.3, CX Team, CEB approval"
  intent_confidence_threshold: "A12.3: default 0.70, range 0.50-0.95, NLU Team, A/B test required"
  retrieval_confidence_threshold: "A12.3: default 0.65, range 0.50-0.90, NLU Team, A/B test required"
  max_conversation_turns: "A12.3: default 25, range 10-50, Product, standard change"
  session_timeout_minutes: "A12.3: default 5; ceiling 5 (D-56)"

constants:                 # fixed by A6; a change is a change to the brief's trigger, not a tuning step
  esc003_confidence_floor: 0.40
  esc003_consecutive_turns: 3
  esc004_consecutive_turns: 2
  esc005_dispute_amount_inr: 50000
  esc006_human_requests: 3
  esc007_high_value_inr: 500000
  esc010_turns: 15

proposals:                 # not in the brief; each is recorded as a decision and needs owner sign-off
  flow_entry_confidence: 0.50               # D-19 (existing): SEC-001, SEC-004, GEN-007, GEN-003, PRD-005
  sentiment_turn_confidence_min: 0.70       # D-18 (existing)
  legal_threat_tertiary_confidence: 0.65    # tertiary act threshold in config/intents.yaml
  otp_failures_lock: 3                      # D-65 (existing), auth-flow.mmd
  crisis_pickup_target_seconds: 60          # D-118: operational reading of IMMEDIATE
  turn_unit: message                        # D-119: one logged customer or agent message (A10.2 turn record); system turns excluded
  esc004_cancel_sentiment_min: -0.40        # D-200 (amends D-125): recovery when latest raw >= this value (non-strict); anchor is Case Study 5 p.53 turn 5 (-0.4, "recovering")
  wait_update_interval_seconds: 60          # D-124
  handoff_attempts_max: 2                   # D-123
  sla_warn_fraction: 0.70                   # D-128: same warn convention as monitoring-dashboard.md section 6
  sla_attainment_target_pct: {P0: 95, P1: 90, P2: 85}   # D-128
  ageing_boost_fraction: 0.80               # D-127
  repeat_contact_window_days: 7             # D-121; A5.3 tracks 7/14/30 days
  clarification_failures_handoff: 2         # existing (dialogue-management.md section 4.4)

# ---------------------------------------------------------------------------------------------------------------- signals
# Every identifier used in a `fire_when` expression is defined here. `in_schema: true` means the field exists in
# config/dialogue_state.schema.json today; `in_schema: false` means it is a proposed addition (D-120) or an input that
# reaches the Escalation Router from another component (component-interfaces.md row 8: "DialogueState, trigger signals").
# `prompt_visible: false` means the value never enters a prompt layer or a reply (it is router-side only).
signals:
  intent:                 {source: state.intent.label, in_schema: true, type: string}
  intent_conf:            {source: state.intent.confidence, in_schema: true, type: number}
  tertiary:               {source: "state.intent.layer_path[2]", in_schema: true, type: string}
  tertiary_conf:          {source: state.intent.layer_confidence.tertiary, in_schema: true, type: number, note: "not used in a fire_when; input to the legal_threat signal"}
  low_conf_streak:        {source: state.consecutive_low_conf, in_schema: true, type: integer, note: "customer turns with secondary confidence below 0.40; any turn at or above 0.40, or an answered clarification, resets it (nlu-pipeline-overview.md rule 4)"}
  human_requests:         {source: state.human_request_count, in_schema: true, type: integer, note: "explicit and implicit requests (GEN-003)"}
  explicit_human_request: {source: "nlu: GEN-003 tertiary first_request or repeated_request on this turn at flow_entry_confidence", in_schema: false, type: boolean}
  clarify_failures:       {source: state.clarification_attempts, in_schema: true, type: integer, note: "incremented only in the CLARIFY state (confidence 0.40 to 0.70, same ambiguity); FAIL_SAFE turns below 0.40 do not increment it, so XTR-04 cannot pre-empt ESC-003 (D-169)"}
  neg_sentiment_streak:   {source: state.escalation.neg_sentiment_streak, in_schema: false, type: integer, note: "consecutive customer turns whose sarcasm-adjusted raw score is below escalation_sentiment_threshold with sentiment confidence at or above 0.70; an uncertain turn neither adds nor resets (sentiment.md 5.1, D-18)"}
  sentiment_ema_route:    {source: "derived from state.sentiment.trajectory and state.sentiment.current", in_schema: false, type: boolean, note: "secondary languages only (D-18, D-165): at least const.esc004_consecutive_turns consecutive customer turns whose raw score is strictly below the threshold, with the sentiment-confidence gate waived, and the smoothed score strictly below the threshold. Only the confidence gate is waived; the brief's count and strict threshold are never relaxed"}
  latest_sentiment:       {source: "last element of state.sentiment.trajectory", in_schema: true, type: number, note: "not used in a fire_when; used by the ESC-004 recovery condition (routing-and-handoff.md section 9.2)"}
  turn_count:             {source: "A10.1 turn_count (messages by customer and agent)", in_schema: false, type: integer}
  turns_since_resolution: {source: state.escalation.turns_since_resolution, in_schema: false, type: integer, note: "messages since the conversation started or since a topic last reached status resolved, whichever is later"}
  open_topic:             {source: "any state.topic_stack[].status in (active, parked)", in_schema: true, type: boolean}
  dispute_amount_inr:     {source: "state.slots.amount.value for a TXN-002 dispute, validated; the system-of-record amount replaces the stated amount once the transaction is looked up; several transactions in one dispute are summed", in_schema: true, type: number}
  dispute_open:           {source: "a TXN-002 topic is active or parked and its amount slot is validated (D-167). When ESC-005 owns the handoff the live transfer waits until transaction_id and dispute_reason are also captured (KB-ESC-006 intake_first); as a secondary trigger under a P0 owner it is recorded at once", in_schema: true, type: boolean}
  legal_threat:           {source: "rule lexicon (court, lawyer, legal notice, consumer forum, sue, ombudsman complaint as a threat) in a first-person threat frame, or CMP-003 tertiary legal_threat at legal_threat_tertiary_confidence (disambiguation.md pair 4)", in_schema: false, type: boolean}
  fraud_signal:           {source: "sub_rules of ESC-001", in_schema: false, type: boolean}
  access_report:          {source: "sub_rules of ESC-009", in_schema: false, type: boolean}
  crisis_signal:          {source: "Input Guard crisis screen hit, or GEN-007 at flow_entry_confidence", in_schema: false, type: boolean}
  aml_indicator:          {source: "GR-REG-09 or GR-REG-10 hit (customer-stated or structuring cue; indicator list is an AML team input, G-03)", in_schema: false, type: boolean, prompt_visible: false}
  retrieval_decision:     {source: "RetrievalResult.decision (component-interfaces.md row 6)", in_schema: false, type: string}
  advisor_requested:      {source: "customer accepts the advisor offer (GR-ADV-08) or asks for an advisor directly", in_schema: false, type: boolean}
  closure_requested:      {source: "ACC-005 tertiary closure_request at full_kyc", in_schema: true, type: boolean}
  high_value:             {source: "customer record: total deposit balance above esc007_high_value_inr, read through a tool", in_schema: false, type: boolean, prompt_visible: false}
  pep_flag:               {source: "customer record attribute read through a tool; never inferred from conversation (GR-REG-11)", in_schema: false, type: boolean, prompt_visible: false}
  customer_identified:    {source: "state.auth_level != anonymous", in_schema: true, type: boolean}
  account_specific:       {source: "the active intent's action in config/intents.yaml is not `info`", in_schema: true, type: boolean}
  data_access_failed:     {source: "ToolResult.ok == false for a read needed by the active intent after the single read retry, or the tool circuit is open, or every rung of GR-SYS-01 failed", in_schema: false, type: boolean}
  otp_failures:           {source: state.escalation.otp_failures, in_schema: false, type: integer, note: "failed OTP entries in the secure widget in this session (auth-flow.mmd)"}
  ato_pattern:            {source: "KB-TRB-011 check: credential reset or sensitive request shortly after a contact-details change", in_schema: false, type: boolean, prompt_visible: false}
  adversarial_escalate:   {source: "GR-ATK-04: second flagged turn with a data target (D-72, D-91); or GR-ATK-05 / GR-SEC-R8: authority claim with a request (D-60)", in_schema: false, type: boolean, prompt_visible: false}
  intent_requires_human:  {source: "the active intent's action in config/intents.yaml is `handoff`", in_schema: true, type: boolean}
  care_disclosure:        {source: "customer states, in this session, a bereavement, a serious illness or disability affecting use of the service, or financial hardship (PRD-002 emi_restructuring_request); never inferred, never stored beyond the session (A11.3)", in_schema: false, type: boolean}
  followup_deadline_missed: {source: "a scheduled follow-up timer set by the agent expired without the awaited event (Case Study 6 turn 6)", in_schema: false, type: boolean}

expression_grammar: "identifiers from `signals`, `const.<name>` from `constants`, `prop.<name>` from `proposals`, `param.<name>` from `parameters_ref`; operators == != < <= > >= in && || !; parentheses; string and number literals. Evaluated after every customer turn and on tool or guard events, before the reply is generated."

# ---------------------------------------------------------------------------------------------------------------- queues
# The 15 target queues are the brief's (A6), one per trigger. Mode, hours, languages and overflow are proposals (D-121, D-122, D-127).
# overflow: ordered list of other brief queues tried when the queue is unavailable or its forecast wait exceeds the SLA;
# `callback` is the last step for every queue (component-interfaces.md row 8). No new queue is invented.
queues:
  - {name: Fraud Investigation,    trigger: ESC-001, mode: live, hours: 24x7,     overflow: [Security Operations, Senior Resolution Mgr, callback]}
  - {name: Senior Resolution Mgr,  trigger: ESC-002, mode: live, hours: extended, overflow: [Customer Retention, Supervisor Review, callback]}
  - {name: General Support,        trigger: ESC-003, mode: live, hours: 24x7,     overflow: [Next Available Agent, Supervisor Review, callback]}
  - {name: Customer Retention,     trigger: ESC-004, mode: live, hours: extended, overflow: [Senior Resolution Mgr, Next Available Agent, callback]}
  - {name: Dispute Resolution,     trigger: ESC-005, mode: live, hours: extended, overflow: [General Support, callback]}
  - {name: Next Available Agent,   trigger: ESC-006, mode: live, hours: 24x7,     overflow: [General Support, Supervisor Review, callback]}
  - {name: Relationship Manager,   trigger: ESC-007, mode: live, hours: extended, overflow: [Customer Retention, callback]}
  - {name: Compliance Helpdesk,    trigger: ESC-008, mode: live, hours: extended, overflow: [callback]}
  - {name: Security Operations,    trigger: ESC-009, mode: live, hours: 24x7,     overflow: [Fraud Investigation, Senior Resolution Mgr, callback]}
  - {name: Supervisor Review,      trigger: ESC-010, mode: live, hours: extended, overflow: [Senior Resolution Mgr, General Support, callback]}
  - {name: Crisis Response,        trigger: ESC-011, mode: live, hours: 24x7,     overflow: [Security Operations, Fraud Investigation, Senior Resolution Mgr, Next Available Agent]}
  - {name: AML Compliance,         trigger: ESC-012, mode: case, hours: 24x7,     overflow: [Enhanced Due Diligence, Compliance Helpdesk], no_qualified_analyst: "the case waits with an incident alert; it is never shown to another queue"}
  - {name: Wealth Advisory,        trigger: ESC-013, mode: live, hours: extended, overflow: [callback]}
  - {name: Technical Support,      trigger: ESC-014, mode: live, hours: extended, overflow: [General Support, callback]}
  - {name: Enhanced Due Diligence, trigger: ESC-015, mode: live, hours: extended, overflow: [AML Compliance, Compliance Helpdesk, callback]}

queue_hours:               # proposals (D-122); the brief gives no operating hours
  "24x7": "always staffed"
  extended: "08:00-22:00 IST, all days; outside these hours the after-hours rule of the trigger applies"

after_hours:               # proposals (D-122, D-163). The brief sets no hours and no hours exemption, so this block is a DEVIATION from A6 that needs Risk Committee sign-off
  P1: "live handoff to Next Available Agent (24x7) with the full package and the specialist case opened in the target queue for the next opening; callback offered; a callback time is a request, not a guarantee (D-09)"
  P2: "the queue's own overflow chain; General Support and Next Available Agent are 24x7"
  exceptions:
    ESC-008: "no generalist answers the regulatory question; callback from the Compliance Helpdesk"
    ESC-013: "no generalist gives advice; callback from Wealth Advisory (TPL-ADV-ADVISOR-UNAVAILABLE)"
    ESC-015: "the due-diligence case is opened at once (silent); a live handoff for an account-specific request waits for the desk, callback offered; generic information is still served"
  sla_counting: "EQ-07 is reported in-hours and all-hours. After-hours ESC-008, ESC-013 and ESC-015 live handoffs that the target queue does not pick up inside the brief SLA are SLA misses. For ESC-002, ESC-004, ESC-005 and ESC-007 the generalist pickup and the target-queue pickup are both reported; only the target-queue pickup counts toward the brief SLA"
  sla_compliant_alternative: "an on-call rota for Enhanced Due Diligence and Compliance Helpdesk (and, if the Risk Committee requires, the other seven extended-hours queues), which removes the deviation"

languages:                 # proposals (D-121)
  all_queues: [en, hi, hinglish]
  secondary: {languages: [ta, te, bn, mr, gu], pools: [General Support, Next Available Agent], hours: extended}
  rule: "language match is attempted for P1 and P2 if it does not breach the SLA; P0 never waits for a language match; the package carries state.language.primary and the summary is written in English plus the customer's language"

# ---------------------------------------------------------------------------------------------------------------- precedence
# Used when several triggers are true in the same evaluation. Rank 1 owns the live handoff. Every other fired trigger is
# recorded in the handoff package as a secondary trigger and never dropped. Triggers marked parallel_case always open
# their own case, whoever owns the live conversation. (Proposal, D-116.)
precedence:
  rule_order:
    - "1. Priority: P0 before P1 before P2 (P0 always wins)."
    - "2. Within a priority: the shorter SLA first (IMMEDIATE, then 2, 5, 10, 15 minutes)."
    - "3. Within the same priority and SLA: precedence_rank (life safety, then containment of live access, then loss investigation, then compliance case, then the most specific specialist queue, then generic signals)."
    - "4. A pending escalation is upgraded, never downgraded, when a higher-ranked trigger fires. The deadline after a change of owner is the earlier of the pending deadline and the new trigger's SLA counted from the change; a change of owner never moves the customer's deadline later (D-166)."
    - "5. XTR rules that raise a brief trigger take that trigger's rank; XTR rules with their own route rank after all 15."
  ranked: [ESC-011, ESC-009, ESC-001, ESC-012, ESC-015, ESC-002, ESC-005, ESC-007, ESC-004, ESC-008, ESC-013, ESC-006, ESC-014, ESC-003, ESC-010]

# ---------------------------------------------------------------------------------------------------------------- triggers
# cancellable: never | customer_only | customer_or_recovery   (docs/escalation/routing-and-handoff.md section 9)
# handoff_mode: warm (customer told, live transfer) | discreet (live transfer, reason not stated to the customer)
#               | silent_case (case opened for the queue; the customer is not told; the conversation continues within the rules)
# intent_scope: linked (fires only in the flows of the linked intents) | any (conversation-level; can fire on any intent)
# intents / guardrails / kb_entries equal the links already recorded in config/intents.yaml, config/guardrails.yaml and
# docs/knowledge-base/entries/*.yaml (checked by the validator).
triggers:

- id: ESC-001
  origin: brief
  brief: {condition: "Confirmed or suspected fraud", priority: P0, queue: "Fraud Investigation", sla: "<2 min", citation: "A6 p.16"}
  condition_text: confirmed or suspected fraud
  priority: P0
  queue: Fraud Investigation
  sla: under 2 min
  sla_seconds: 120
  precedence_rank: 3
  cancellable: never
  handoff_mode: warm
  parallel_case: false
  intent_scope: linked
  fire_when: "fraud_signal || adversarial_escalate"
  sub_rules:
    - {id: ESC-001.a, when: "intent == 'SEC-001' && intent_conf >= prop.flow_entry_confidence && tertiary in ['unauthorised_transaction', 'card_misuse', 'scam_victim', 'identity_theft']", source: customer_report, note: "in a multi-intent turn SEC-001 also matches as an alternative hypothesis at prop.flow_entry_confidence or more (D-167)"}
    - {id: ESC-001.b, when: "intent == 'SEC-004' && tertiary == 'deny_not_me'", source: customer_report, note: "becomes SEC-001 unauthorised_transaction at once (config/intents.yaml)"}
    - {id: ESC-001.c, when: "customer denies knowing the merchant or the payment after the pair 5 question (TXN-002 unrecognised_charge), or states a scam cue (shared OTP, clicked a link, fake bank call, remote-access app, a demand for money under threat or coercion)", source: customer_report, note: "Case Study 2 turn 5; disambiguation.md pair 5"}
    - {id: ESC-001.d, when: "after a CRD-001 block the customer confirms payments they did not make (pair 6)", source: customer_report}
    - {id: ESC-001.e, when: "SEC-002 where the customer already clicked, shared a credential or paid", source: customer_report, note: "reclassified SEC-001 scam_victim; a phishing report with no action taken is a ticket, not ESC-001"}
    - {id: ESC-001.f, when: "adversarial_escalate", source: system, handoff_mode: silent_case, note: "D-60, D-72, D-91: authority claim with a request, or second flagged turn with a data target; the customer sees the neutral refusal and the human option, never an accusation"}
  protective_actions: "card block offered with explicit confirmation at otp_verified or above before the handoff (D-16, D-08, KB-POL-006); an anonymous reporter gets the fast OTP step and, if it fails, the P0 handoff still happens"
  detectors: [input_guard, nlu_service, policy_engine]
  owner_component: escalation_router
  state_fields: [intent, intent_conf, tertiary, auth_level, guardrails.triggered, actions_taken, sentiment.trajectory]
  intents: [TXN-002, CRD-001, SEC-001, SEC-002, SEC-004]
  guardrails: [GR-SEC-R3, GR-SEC-R4, GR-SEC-R5, GR-SEC-R6, GR-SEC-R8, GR-ATK-04, GR-ATK-05]
  kb_entries: [KB-ESC-002, KB-ESC-010, KB-POL-011, KB-TRB-003, KB-TRB-005, KB-TRB-008]
  templates: [TPL-ESC-FRAUD-P0, TPL-ESC-HANDOFF-WARM]
  tests: [ESC-T-001-01, ESC-T-001-02, ESC-T-001-03]
  decisions: [D-08, D-16, D-60, D-72, D-91, D-115, D-167]

- id: ESC-002
  origin: brief
  brief: {condition: "Customer threatens legal action", priority: P1, queue: "Senior Resolution Mgr", sla: "<5 min", citation: "A6 p.16"}
  condition_text: customer threatens legal action
  priority: P1
  queue: Senior Resolution Mgr
  sla: under 5 min
  sla_seconds: 300
  precedence_rank: 6
  cancellable: never
  handoff_mode: warm
  parallel_case: false
  intent_scope: any
  fire_when: "legal_threat"
  sub_rules:
    - {id: ESC-002.a, when: "legal_threat", source: customer_statement, note: "fires regardless of other scores (disambiguation.md pair 4); a question about how the ombudsman route works is CMP-003 ombudsman_info and does not fire"}
  protective_actions: "none; the agent does not argue, admit liability or comment on the law (KB-ESC-005); grievance route still given within 2 turns (GR-REG-03)"
  detectors: [nlu_service]
  owner_component: escalation_router
  state_fields: [intent, tertiary, tertiary_conf, sentiment.trajectory, carry_over.open_tickets]
  intents: [CMP-001, CMP-003]
  guardrails: [GR-REG-03, GR-REG-19]
  kb_entries: [KB-ESC-005, KB-ESC-010, KB-REG-002]
  templates: [TPL-ESC-HANDOFF-WARM]
  tests: [ESC-T-002-01, ESC-T-002-02]
  decisions: [D-125]

- id: ESC-003
  origin: brief
  brief: {condition: "Confidence <40% for 3+ consecutive turns", priority: P2, queue: "General Support", sla: "<10 min", citation: "A6 p.16"}
  condition_text: confidence below 40% for 3 or more consecutive turns
  priority: P2
  queue: General Support
  sla: under 10 min
  sla_seconds: 600
  precedence_rank: 14
  cancellable: customer_or_recovery
  handoff_mode: warm
  parallel_case: false
  intent_scope: any
  fire_when: "low_conf_streak >= const.esc003_consecutive_turns"
  sub_rules:
    - {id: ESC-003.a, when: "low_conf_streak >= const.esc003_consecutive_turns", source: system, note: "confidence is the secondary-layer intent confidence (D-06); the streak counts customer turns"}
    - {id: ESC-003.b, when: "NLU service unavailable and the rule tier also yields no intent for 3 customer turns", source: system, note: "an outage is treated as low confidence (component-interfaces.md row 3)"}
  protective_actions: none
  detectors: [nlu_service, state_tracker]
  owner_component: escalation_router
  state_fields: [consecutive_low_conf, intent.confidence, intent.alternatives, clarification_attempts]
  intents: [GEN-004]
  guardrails: [GR-SYS-01]
  kb_entries: [KB-ESC-010, KB-ESC-020]
  templates: [TPL-ESC-HANDOFF-WARM, TPL-ESC-ABANDONED-P2, TPL-ESC-HANDOFF-CANCELLED]
  tests: [ESC-T-003-01, ESC-T-003-02, ESC-T-003-03]
  decisions: [D-06]

- id: ESC-004
  origin: brief
  brief: {condition: "Sentiment score <-0.7 for 2+ turns", priority: P1, queue: "Customer Retention", sla: "<5 min", citation: "A6 p.16"}
  condition_text: sentiment score below -0.7 for 2 or more turns
  priority: P1
  queue: Customer Retention
  sla: under 5 min
  sla_seconds: 300
  precedence_rank: 9
  cancellable: customer_or_recovery
  handoff_mode: warm
  parallel_case: false
  intent_scope: any
  fire_when: "neg_sentiment_streak >= const.esc004_consecutive_turns || sentiment_ema_route"
  sub_rules:
    - {id: ESC-004.a, when: "neg_sentiment_streak >= const.esc004_consecutive_turns", source: system, note: "threshold is param.escalation_sentiment_threshold (default -0.70, the A6 value); strict less-than, as the brief writes it"}
    - {id: ESC-004.b, when: "sentiment_ema_route", source: system, note: "secondary languages only (D-18, D-165): waives the sentiment-confidence gate of sub-rule a and nothing else; still needs 2 consecutive raw scores strictly below the threshold; awaiting CEB view"}
  protective_actions: "none; Empathy-First reply (A9.1 Pattern 1); the agent keeps working on the problem while the customer waits (Case Study 5)"
  detectors: [nlu_service, state_tracker]
  owner_component: escalation_router
  state_fields: [sentiment.trajectory, sentiment.current, sentiment.slope, sentiment.sarcasm_suspected, sentiment.emotions]
  intents: [CMP-001, CMP-003, CMP-005]
  guardrails: [GR-REG-03]
  kb_entries: [KB-ESC-005, KB-ESC-010]
  templates: [TPL-ESC-HANDOFF-WARM, TPL-ESC-DEESCALATION-CHECK, TPL-ESC-HANDOFF-CANCELLED]
  tests: [ESC-T-004-01, ESC-T-004-02, ESC-T-004-03, ESC-T-004-04, ESC-T-004-05]
  decisions: [D-18, D-125, D-165]

- id: ESC-005
  origin: brief
  brief: {condition: "Dispute exceeding INR 50,000", priority: P1, queue: "Dispute Resolution", sla: "<5 min", citation: "A6 p.16"}
  condition_text: "dispute exceeding INR 50,000"
  priority: P1
  queue: Dispute Resolution
  sla: under 5 min
  sla_seconds: 300
  precedence_rank: 7
  cancellable: never
  handoff_mode: warm
  parallel_case: false
  intent_scope: linked
  fire_when: "dispute_open && dispute_amount_inr > const.esc005_dispute_amount_inr"
  sub_rules:
    - {id: ESC-005.a, when: "dispute_open && dispute_amount_inr > const.esc005_dispute_amount_inr", source: system, note: "strictly above INR 50,000; fires once transaction_id, dispute_reason and amount are captured (KB-ESC-006 intake_first); if the customer corrects the amount to INR 50,000 or less before pickup the record is withdrawn as condition_false, which is not a cancellation"}
  protective_actions: "none; intake only, no refund or date promised (D-09)"
  detectors: [nlu_service, tool_orchestrator, state_tracker]
  owner_component: escalation_router
  state_fields: [intent, slots.amount, slots.transaction_id, slots.dispute_reason, topic_stack]
  intents: [TXN-002]
  guardrails: []
  kb_entries: [KB-ESC-006, KB-ESC-010, KB-TRB-005, KB-TRB-006]
  templates: [TPL-ESC-HANDOFF-WARM]
  tests: [ESC-T-005-01, ESC-T-005-02]
  decisions: [D-09, D-125]

- id: ESC-006
  origin: brief
