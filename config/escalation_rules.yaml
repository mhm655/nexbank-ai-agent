  owner_component: escalation_router
  state_fields: [intent, guardrails.triggered, slots.amount]
  intents: [TXN-006, SEC-001]
  guardrails: [GR-SEC-R3, GR-SEC-R6, GR-REG-09, GR-REG-10]
  kb_entries: [KB-ESC-009, KB-ESC-010, KB-REG-004]
  templates: []
  tests: [ESC-T-012-01, ESC-T-012-02]
  decisions: [D-116]

- id: ESC-013
  origin: brief
  brief: {condition: "Investment advisory requiring SEBI advisor", priority: P1, queue: "Wealth Advisory", sla: "<10 min", citation: "A6 p.17"}
  condition_text: investment advisory requiring SEBI advisor
  priority: P1
  queue: Wealth Advisory
