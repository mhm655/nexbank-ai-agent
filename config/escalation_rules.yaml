  sub_rules:
    - {id: ESC-014.a, when: "data_access_failed", source: system, note: "after the single read retry (component-interfaces.md row 7); writes are never retried; a slow but successful read does not fire; a KB miss is not a system error (that is graceful degradation or ESC-008)"}
  protective_actions: "honest status with no technical jargon and no timeline promise (A9.1 Pattern 4, D-09)"
  detectors: [tool_orchestrator, policy_engine, output_safety_layer]
  owner_component: escalation_router
  state_fields: [intent, actions_taken, guardrails.triggered]
  intents: [TXN-001, TXN-003, TXN-004]
  guardrails: [GR-SYS-01]
  kb_entries: [KB-ESC-010, KB-TRB-001, KB-TRB-002, KB-TRB-004, KB-TRB-009]
  templates: [TPL-ESC-HANDOFF-WARM, TPL-ESC-ABANDONED-P2, TPL-ESC-HANDOFF-CANCELLED]
