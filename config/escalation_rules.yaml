  kb_entries: [KB-ESC-008, KB-ESC-010, KB-POL-001, KB-REG-005, KB-REG-006, KB-REG-011]
  templates: [TPL-ADV-ADVISOR-OFFER, TPL-ADV-ADVISOR-CONFIRM, TPL-ADV-ADVISOR-UNAVAILABLE]
  tests: [ESC-T-013-01, ESC-T-013-02]
  decisions: [D-55]

- id: ESC-014
  origin: brief
  brief: {condition: "System error preventing data access", priority: P2, queue: "Technical Support", sla: "<10 min", citation: "A6 p.17"}
  condition_text: system error preventing data access
  priority: P2
  queue: Technical Support
