# Plain-language label tables used by locked template slots (Day 13, D-136).
# A label is chosen by the Policy Engine or the Escalation Router from these tables, never written by the model.
# Hindi and Hinglish labels are not native-reviewed. Validator: tests/templates/validate_templates.py checks that all 15
# queues of config/escalation_rules.yaml have a label, that every intent id, tool name and notice code here exists, and that
# the label tables added in D-198 (below) follow the wording rules of the templates.
schema_version: "1.0"
review: {hi: not_native_reviewed, hinglish: not_native_reviewed}

# Slot `team_plain`. Grammar contract: the English label follows "our"; the Hindi label is a feminine noun phrase ending in
#   the Hindi word for team so that it follows the feminine form of "our"; the Hinglish label follows "hamari". `customer_visible: false` means the queue name is never
# shown: the discreet or silent handoff wording is used instead (TPL-ESC-HANDOFF-DISCREET, or no handoff message at all).
queue_plain_names:
  Fraud Investigation:    {customer_visible: true,  en: "fraud team",               hi: "फ्रॉड टीम",              hinglish: "fraud team"}
  Senior Resolution Mgr:  {customer_visible: true,  en: "senior resolution team",   hi: "वरिष्ठ समाधान टीम",       hinglish: "senior resolution team"}
  General Support:        {customer_visible: true,  en: "support team",             hi: "सहायता टीम",             hinglish: "support team"}
  Customer Retention:     {customer_visible: true,  en: "customer care team",       hi: "ग्राहक सेवा टीम",          hinglish: "customer care team"}
  Dispute Resolution:     {customer_visible: true,  en: "disputes team",            hi: "विवाद समाधान टीम",        hinglish: "disputes team"}
  Next Available Agent:   {customer_visible: true,  en: "support team",             hi: "सहायता टीम",             hinglish: "support team"}
  Relationship Manager:   {customer_visible: true,  en: "relationship team",        hi: "रिलेशनशिप टीम",          hinglish: "relationship team"}
  Compliance Helpdesk:    {customer_visible: true,  en: "compliance helpdesk team", hi: "अनुपालन हेल्पडेस्क टीम",    hinglish: "compliance helpdesk team"}
  Security Operations:    {customer_visible: true,  en: "security team",            hi: "सुरक्षा टीम",              hinglish: "security team"}
  Supervisor Review:      {customer_visible: true,  en: "senior support team",      hi: "वरिष्ठ सहायता टीम",       hinglish: "senior support team"}
  Crisis Response:        {customer_visible: false, en: "team",                     hi: "टीम",                    hinglish: "team"}
  AML Compliance:         {customer_visible: false, en: "team",                     hi: "टीम",                    hinglish: "team"}
  Wealth Advisory:        {customer_visible: true,  en: "advisory team",            hi: "सलाहकार टीम",            hinglish: "advisory team"}
  Technical Support:      {customer_visible: true,  en: "support team",             hi: "सहायता टीम",             hinglish: "support team"}
  Enhanced Due Diligence: {customer_visible: false, en: "team",                     hi: "टीम",                    hinglish: "team"}

# Notes on three choices (proposals):
#   Customer Retention is shown as "customer care team": the word "retention" describes the bank's interest, not the customer's.
#   Technical Support is shown as "support team": "technical" invites jargon (A9.1 Pattern 4: no technical jargon).
#   Supervisor Review is shown as "senior support team": no individual supervisor is promised.

