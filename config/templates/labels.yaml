# Slot `finish_offer` of TPL-ESC-HUMAN-REQUEST-FIRST (XTR-01 request 1). Key: the pending intent. One full sentence naming one step the agent
# can complete in this turn; it follows "I can bring in a colleague." The Policy Engine picks it only when the step needs no new
# verification and no confirmation (a read), so the customer is never held back by it.
finish_offer_sentences:
  ACC-001: {en: "I can also show your balance right now.",                    hi: "मैं अभी आपका बैलेंस भी दिखा सकता हूँ।",          hinglish: "Main abhi aapka balance bhi dikha sakta hoon."}
  TXN-001: {en: "I can also check the status of that payment right now.",      hi: "मैं अभी उस भुगतान की स्थिति भी देख सकता हूँ।",      hinglish: "Main abhi us payment ka status bhi check kar sakta hoon."}
  TXN-003: {en: "I can also check the status of that UPI payment right now.",  hi: "मैं अभी उस UPI भुगतान की स्थिति भी देख सकता हूँ।", hinglish: "Main abhi us UPI payment ka status bhi check kar sakta hoon."}
