action_noun_labels:
  block_card:                 {en: "the card block",                  hi: "कार्ड ब्लॉक",                  hinglish: "card block"}
  request_replacement:        {en: "the replacement request",         hi: "नए कार्ड का अनुरोध",             hinglish: "replacement request"}
  create_dispute_ticket:      {en: "the dispute ticket",              hi: "विवाद टिकट",                    hinglish: "dispute ticket"}
  create_complaint:           {en: "the complaint registration",      hi: "शिकायत का पंजीकरण",              hinglish: "complaint registration"}
  send_credential_reset_link: {en: "the reset link",                  hi: "रीसेट लिंक",                    hinglish: "reset link"}
  schedule_callback:          {en: "the callback request",            hi: "कॉलबैक का अनुरोध",               hinglish: "callback request"}
  flag_fraud:                 {en: "the fraud report",                hi: "धोखाधड़ी की सूचना",              hinglish: "fraud report"}
  get_balance:                {en: "your account balance",            hi: "आपके खाते का बैलेंस",            hinglish: "aapke account ka balance"}
  get_txn:                    {en: "the status of that payment",      hi: "उस भुगतान की स्थिति",            hinglish: "us payment ka status"}
  search_txn:                 {en: "your recent transactions",        hi: "आपके हाल के लेन-देन",            hinglish: "aapke recent transactions"}
  get_card_status:            {en: "your card status",                hi: "आपके कार्ड की स्थिति",           hinglish: "aapke card ka status"}
  get_complaint_status:       {en: "your complaint status",           hi: "आपकी शिकायत की स्थिति",          hinglish: "aapki complaint ka status"}
  get_statement:              {en: "your statement",                  hi: "आपका स्टेटमेंट",                hinglish: "aapka statement"}

# Slot `result_plain` of TPL-ACT-DONE (the `result_label` the executed tool returns). Key: the tool. Grammar contract: a clause that
# follows "That's done:" and ends without a full stop. {{card_last4}} is the masked last four digits from the same tool result.
result_labels:
  block_card:                 {en: "your card ending {{card_last4}} is blocked",                                                    hi: "{{card_last4}} पर समाप्त होने वाला आपका कार्ड ब्लॉक हो गया है",                          hinglish: "{{card_last4}} par khatm hone wala aapka card block ho gaya hai"}
  request_replacement:        {en: "a replacement for your blocked card ending {{card_last4}} has been requested",                   hi: "{{card_last4}} पर समाप्त होने वाले आपके ब्लॉक किए हुए कार्ड के नए कार्ड का अनुरोध दर्ज हो गया है", hinglish: "{{card_last4}} par khatm hone wale aapke blocked card ke replacement ki request ho gayi hai"}
  create_dispute_ticket:      {en: "a dispute ticket is open for this charge",                                                       hi: "इस शुल्क के लिए विवाद टिकट खुल गया है",                                             hinglish: "is charge ke liye dispute ticket khul gaya hai"}
  create_complaint:           {en: "your complaint is registered",                                                                   hi: "आपकी शिकायत दर्ज हो गई है",                                                        hinglish: "aapki complaint register ho gayi hai"}
  send_credential_reset_link: {en: "a reset link has been sent to your registered contact",                                           hi: "आपके पंजीकृत संपर्क पर रीसेट लिंक भेज दिया गया है",                                    hinglish: "aapke registered contact par reset link bhej diya gaya hai"}
  schedule_callback:          {en: "your callback request is placed",                                                                hi: "आपका कॉलबैक अनुरोध दर्ज हो गया है",                                                  hinglish: "aapki callback request place ho gayi hai"}
  get_statement:              {en: "your statement has been sent to your registered email address",                                  hi: "आपका स्टेटमेंट आपके पंजीकृत ईमेल पते पर भेज दिया गया है",                              hinglish: "aapka statement aapke registered email address par bhej diya gaya hai"}
  flag_fraud:                 {en: "your report is recorded",                                                                        hi: "आपकी सूचना दर्ज हो गई है",                                                         hinglish: "aapki report record ho gayi hai"}

# Slot `service_plain` of TPL-SYS-NOTICE. Key: an intent id from notice.affects.intents; `all` when the list is empty. Grammar contract:
# English follows "affecting"; the Hindi label is already in the form that precedes the Hindi postposition "mein" (oblique); Hinglish precedes "mein".
service_labels:
  TXN-001: {en: "transaction status checks",  hi: "लेन-देन की स्थिति की जाँच",    hinglish: "transaction status checks"}
  TXN-003: {en: "UPI payments",               hi: "UPI भुगतान",                   hinglish: "UPI payments"}
  TXN-004: {en: "NEFT and RTGS transfers",    hi: "NEFT और RTGS ट्रांसफ़र",        hinglish: "NEFT aur RTGS transfers"}
  ACC-001: {en: "balance checks",             hi: "बैलेंस की जाँच",                hinglish: "balance checks"}
  CRD-001: {en: "card services",              hi: "कार्ड सेवाओं",                  hinglish: "card services"}
  PRD-001: {en: "product information",        hi: "उत्पादों की जानकारी",            hinglish: "product information"}
  GEN-008: {en: "some bank services",         hi: "बैंक की कुछ सेवाओं",             hinglish: "kuch bank services"}
  all:     {en: "some of our services",       hi: "हमारी कुछ सेवाओं",               hinglish: "hamari kuch services"}

# Sentence `effect_statement` of TPL-SYS-NOTICE (D-193). Key: the closed field notice.customer_effect set by operations and validated
# at gate G0. These are the only sentences about the customer's money or payments that may appear in a notice reply; each is attributed
# to the status system, so it is a statement of the system of record and not a claim of the agent.
notice_effect_labels:
  balances_unaffected:   {en: "Our status system shows that account balances are not affected.",                                    hi: "हमारे स्टेटस सिस्टम के अनुसार खाते के बैलेंस पर इसका असर नहीं है।",                        hinglish: "Hamare status system ke mutabiq account balances par iska asar nahi hai."}
  payments_may_lag:      {en: "Our status system shows that some payments may take longer than usual to show as complete.",           hi: "हमारे स्टेटस सिस्टम के अनुसार कुछ भुगतानों के पूरा दिखने में सामान्य से अधिक समय लग सकता है।",   hinglish: "Hamare status system ke mutabiq kuch payments ke complete dikhne mein normal se zyada time lag sakta hai."}
  effect_unknown:        {en: "I can't confirm yet whether your own payments or balances are affected.",                           hi: "मैं अभी यह पुष्टि नहीं कर सकता कि आपके अपने भुगतान या बैलेंस प्रभावित हैं या नहीं।",           hinglish: "Main abhi confirm nahi kar sakta ki aapke apne payments ya balances affected hain ya nahi."}

