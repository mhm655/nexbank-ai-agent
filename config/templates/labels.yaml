# ------------------------------------------------------------------------------------------------ tables added with the Day 13 audit fixes (D-198)
# Source of the phrases: the Day 14 simulations (day14 handoff section e.3), made general. Hindi and Hinglish are not native-reviewed.
# The validator checks that every key exists (tool, intent or notice code), that all three languages are present, that English and
# Hinglish are ASCII, that Hindi has Devanagari, that no digit appears, that the only token is {{card_last4}} (supplied by the same tool
# result) and that the global wording rules of the templates also hold for label text.

# Slot `action_plain` of TPL-ACT-CONFIRM. Key: the tool the Policy Engine is about to call. Grammar contract: English is a verb phrase
# after "I will" and "Should I"; Hindi and Hinglish are verbal nouns (infinitive form), because the template text puts them after
# "karne ja raha hoon:" and "karoon:".
action_verb_labels:
  block_card:                 {en: "block your card",                                          hi: "आपका कार्ड ब्लॉक करना",                                   hinglish: "aapka card block karna"}
  request_replacement:        {en: "request a replacement for your blocked card",               hi: "आपके ब्लॉक किए हुए कार्ड का नया कार्ड मँगवाना",              hinglish: "aapke blocked card ka replacement request karna"}
  create_dispute_ticket:      {en: "open a dispute ticket for this charge",                    hi: "इस शुल्क के लिए विवाद टिकट खोलना",                          hinglish: "is charge ke liye dispute ticket kholna"}
  create_complaint:           {en: "register a complaint for you",                             hi: "आपकी शिकायत दर्ज करना",                                    hinglish: "aapki complaint register karna"}
  send_credential_reset_link: {en: "send a reset link to your registered contact",              hi: "आपके पंजीकृत संपर्क पर रीसेट लिंक भेजना",                    hinglish: "aapke registered contact par reset link bhejna"}
  schedule_callback:          {en: "request a callback for you",                               hi: "आपके लिए कॉलबैक का अनुरोध करना",                             hinglish: "aapke liye callback request karna"}
  get_statement:              {en: "send your account statement to your registered email address", hi: "आपका अकाउंट स्टेटमेंट आपके पंजीकृत ईमेल पते पर भेजना",       hinglish: "aapka account statement aapke registered email address par bhejna"}
  flag_fraud:                 {en: "record your fraud report",                                 hi: "आपकी धोखाधड़ी की सूचना दर्ज करना",                           hinglish: "aapki fraud report record karna"}

