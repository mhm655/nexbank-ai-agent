        en: "I said I'd keep an eye on {{open_item}}, and it hasn't come through. I've passed it to a colleague to look into, with the full history, so you won't need to explain it again."
        hi: "मैंने कहा था कि मैं {{open_item}} पर नज़र रखूँगा, और वह अब तक नहीं हुआ है। मैंने इसे पूरे इतिहास के साथ जाँच के लिए एक सहयोगी को सौंप दिया है, इसलिए आपको दोबारा समझाना नहीं पड़ेगा।"
        hinglish: "Maine kaha tha ki main {{open_item}} par nazar rakhunga, aur woh ab tak nahi hua hai. Maine ise poori history ke saath check karne ke liye ek colleague ko de diya hai, isliye aapko dobara explain nahi karna padega."
