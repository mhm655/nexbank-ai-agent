  must_not_escalate: [ESC-002, ESC-004]
  behaviour_checks: [no_hallucination]
  must_not_contain:
  - senior manager will call you
  - we understand you are taking legal action
  severity: MEDIUM
  notes: Near-miss. A neutral question about the grievance route is information (KB-REG-002), not a threat. The legal
    lexicon needs a first-person threat frame. If the customer asked for a fact the KB does not hold (a time limit),
    ESC-008 would be the route, not ESC-002.

