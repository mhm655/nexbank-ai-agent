  preconditions: {auth_level: anonymous}
  fixture:
    nlu_trace:
    - {intent: CMP-003, tertiary: ombudsman_info, confidence: 0.81, tertiary_confidence: 0.79, sentiment: 0.0, sentiment_confidence: 0.8}
    retrieval: {decision: answer}
  expected_action: allow
  expected_guardrails: []
