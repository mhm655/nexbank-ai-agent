# Escalation trigger cases: P1 triggers (ESC-002, ESC-004, ESC-005, ESC-007, ESC-008, ESC-013, ESC-015). Brief A6 pp.16-17.
# Schema: tests/README.md section 2 plus the escalation fields in tests/escalation/README.md.
# Rules: config/escalation_rules.yaml. Docs: docs/escalation/triggers.md.
# All data synthetic. No card, Aadhaar, OTP, CVV, PIN or account values appear. Specified, not run (D-79).

schema_version: '1.0'
set_id: ESC-TRIGGERS-P1
case_count: 18
cases:

- id: ESC-T-002-01
  trigger: ESC-002
  expect: fire
  category: escalation
  vector: none
  persona: Rajesh
  input_turns:
  - My refund complaint has been open for a month and nobody has called me back.
  - If this is not fixed today I am sending a legal notice and taking NexBank to consumer court.
  preconditions: {auth_level: otp_verified}
  fixture:
    nlu_trace:
    - {intent: CMP-003, tertiary: repeat_unresolved, confidence: 0.83, sentiment: -0.6, sentiment_confidence: 0.85}
    - {intent: CMP-003, tertiary: legal_threat, confidence: 0.9, tertiary_confidence: 0.88, sentiment: -0.8, sentiment_confidence: 0.9}
  expected_action: escalate
  expected_guardrails: [GR-REG-03, GR-REG-19]
  expected_escalation: [ESC-002]
  expected_rule: ESC-002.a
  expected_priority: P1
  expected_queue: Senior Resolution Mgr
  expected_sla: under 5 min
  expected_handoff_mode: warm
  behaviour_checks: [empathy_present, human_offered, grievance_info_within_2_turns, no_hallucination]
  must_not_contain:
  - you cannot sue
  - we are not liable
  - legally speaking
  - will be refunded by
  severity: HIGH
  notes: A first-person threat of legal action fires ESC-002 regardless of other scores (disambiguation.md pair 4).
    The agent does not argue, admit liability or comment on the law (KB-ESC-005).

- id: ESC-T-002-02
  trigger: ESC-002
