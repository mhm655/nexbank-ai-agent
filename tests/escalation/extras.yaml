- id: XTR-T-02-01
  trigger: XTR-02
  expect: fire
  category: escalation
  vector: none
  persona: Meera
  input_turns:
  - The code is not working again. I typed what came on my phone.
  preconditions: {auth_level: anonymous}
  fixture:
    secure_widget_events: [otp_fail, otp_fail, otp_fail]
  expected_action: escalate
  expected_guardrails: [GR-SEC-R2, GR-ATK-10]
  expected_escalation: [ESC-009]
  expected_extra_rules: [XTR-02]
  expected_rule: ESC-009.c
  expected_priority: P0
  expected_queue: Security Operations
  expected_sla: under 2 min
  expected_handoff_mode: warm
  behaviour_checks: [empathy_present, human_offered, no_hallucination]
  must_not_contain:
  - one more attempt is allowed
  - suspicious
  - you have been blocked for fraud
  severity: HIGH
  notes: Three failed OTP entries lock the challenge and raise ESC-009 (D-65 confirmed by D-115; same oracle as
    GR-ATK-10-05). Most such customers are genuine, so the wording is calm and non-accusatory. OTP digits are never
    typed in chat (RED-05).

