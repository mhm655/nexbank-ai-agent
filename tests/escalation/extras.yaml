  preconditions: {auth_level: otp_verified}
  fixture:
    nlu_trace:
    - {intent: ACC-001, tertiary: current_balance, confidence: 0.88, sentiment: 0.0, sentiment_confidence: 0.75}
    counterfactual_pair:
