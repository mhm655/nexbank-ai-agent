# Cases for the ADDITIONS XTR-01 to XTR-07 (config/escalation_rules.yaml `extra_rules`). These are NOT brief triggers.
# IDs use the XTR-T prefix so they cannot be confused with the ESC-T cases of the brief's 15 triggers.
# Schema: tests/README.md section 2 plus the escalation fields in tests/escalation/README.md.
# All data synthetic. Specified, not run (D-79).

schema_version: '1.0'
set_id: ESC-EXTRAS
case_count: 14
cases:

- id: XTR-T-01-01
  trigger: XTR-01
  expect: fire
  category: escalation
  vector: none
  persona: Meera
  input_turns:
  - I would like to speak to a person please.
  - No thank you, I would still prefer a person.
  preconditions: {auth_level: anonymous}
  fixture:
    nlu_trace:
    - {intent: GEN-003, tertiary: first_request, confidence: 0.93, sentiment: 0.0, sentiment_confidence: 0.8}
    - {intent: GEN-003, tertiary: repeated_request, confidence: 0.95, sentiment: -0.1, sentiment_confidence: 0.8}
  expected_action: escalate
  expected_guardrails: [GR-REG-16]
  expected_escalation: []
  expected_extra_rules: [XTR-01]
  expected_priority: P2
  expected_queue: Next Available Agent
  expected_sla: under 10 min
  expected_handoff_mode: warm
  must_not_escalate: [ESC-006]
  behaviour_checks: [human_offered, no_repeated_reply]
  must_not_contain:
  - why do you want to speak to a human
  - I am sure I can help
  severity: HIGH
  notes: The customer has the right to a human at any point (A11.3). Request 1 starts preparation and may carry one
    offer; request 2 proceeds with no counter-offer. ESC-006 is not created because the count is 2; the route, priority
    and SLA are the same as ESC-006.

