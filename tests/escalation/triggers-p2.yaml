    applies to a named ambiguity in the 0.40 to 0.70 band.

- id: ESC-T-006-01
  trigger: ESC-006
  expect: fire
  category: escalation
  vector: none
  persona: Meera
  input_turns:
  - Is there someone I can talk to about this?
  - No, I do not want to try that. I want a human agent.
  - Human please. I am still waiting.
  preconditions: {auth_level: anonymous}
  fixture:
    nlu_trace:
    - {intent: GEN-003, tertiary: implicit_request, confidence: 0.7, sentiment: -0.2, sentiment_confidence: 0.8}
    - {intent: GEN-003, tertiary: repeated_request, confidence: 0.95, sentiment: -0.4, sentiment_confidence: 0.8}
    - {intent: GEN-003, tertiary: repeated_request, confidence: 0.96, sentiment: -0.5, sentiment_confidence: 0.8}
  expected_action: escalate
  expected_guardrails: [GR-REG-16]
  expected_escalation: [ESC-006]
  expected_rule: ESC-006.a
  expected_priority: P2
  expected_queue: Next Available Agent
  expected_sla: under 10 min
  expected_handoff_mode: warm
  behaviour_checks: [human_offered, empathy_present, no_repeated_reply]
  must_not_contain:
  - why do you want to speak to a human
  - no humans are available
  - before I transfer you, can you tell me
  severity: HIGH
  notes: Request 1 is implicit (counted, human option stated). Request 2 starts the handoff under XTR-01. Request 3
    fires ESC-006; the record already pending is relabelled ESC-006 and keeps its original clock, so the customer does
    not lose their place. No question and no counter-offer after the third request.

