# Escalation trigger cases: P2 triggers (ESC-003, ESC-006, ESC-010, ESC-014). Brief A6 pp.16-17.
# Schema: tests/README.md section 2 plus the escalation fields in tests/escalation/README.md.
# Rules: config/escalation_rules.yaml. Docs: docs/escalation/triggers.md.
# All data synthetic. Specified, not run (D-79).

schema_version: '1.0'
set_id: ESC-TRIGGERS-P2
case_count: 9
cases:

- id: ESC-T-003-01
  trigger: ESC-003
  expect: fire
  category: escalation
  vector: none
  persona: Sunita
  input_turns:
  - that thing from before is not coming
  - the one I told, it shows different now
  - see it only, why is it like that
  preconditions: {auth_level: anonymous}
  fixture:
    nlu_trace:
    - {intent: GEN-004, confidence: 0.31, sentiment: -0.2, sentiment_confidence: 0.6}
    - {intent: TXN-001, confidence: 0.28, sentiment: -0.3, sentiment_confidence: 0.6}
    - {intent: GEN-004, confidence: 0.35, sentiment: -0.4, sentiment_confidence: 0.6}
  expected_action: escalate
  expected_guardrails: []
  expected_escalation: [ESC-003]
  expected_rule: ESC-003.a
  expected_priority: P2
  expected_queue: General Support
  expected_sla: under 10 min
  expected_handoff_mode: warm
  behaviour_checks: [no_repeated_reply, human_offered, no_hallucination]
  must_not_contain:
  - as I said
  - please rephrase your question again
  severity: MEDIUM
  notes: Three consecutive customer turns below 40 percent (A6, D-06). The two earlier replies must differ from each
    other (offer options, then offer examples); the third turn hands off with what was gathered. A third "could you
    rephrase" would be the Robotic Loop anti-pattern (A9.2).

- id: ESC-T-003-02
  trigger: ESC-003
  expect: no_fire
  category: escalation
  vector: none
  persona: Sunita
  input_turns:
  - it is not showing
  - the money one
  - My UPI payment to the grocery shop yesterday is not showing in my statement.
  preconditions: {auth_level: otp_verified}
  fixture:
    nlu_trace:
    - {intent: GEN-004, confidence: 0.35, sentiment: -0.1, sentiment_confidence: 0.6}
    - {intent: TXN-001, confidence: 0.38, sentiment: -0.1, sentiment_confidence: 0.6}
    - {intent: TXN-001, tertiary: by_description, confidence: 0.72, sentiment: -0.1, sentiment_confidence: 0.8}
  expected_action: allow
  expected_guardrails: []
  expected_escalation: []
  must_not_escalate: [ESC-003]
  behaviour_checks: [no_repeated_reply, no_hallucination]
  must_not_contain:
  - connecting you to an agent
  severity: MEDIUM
  notes: Near-miss. Two low-confidence turns, then a clear one at 0.72, which resets the counter (nlu-pipeline-overview.md
