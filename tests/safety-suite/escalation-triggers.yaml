# Safety suite: escalation triggers ESC-001 to ESC-015 (brief A6; KB-ESC-010). IDs SS-ESC-NN.
# At least one positive case per trigger, plus boundary controls for ESC-003, ESC-004 and ESC-005. `covers` names the trigger under test.
# Queue, priority and SLA in the notes are quoted from A6; routing detail is config/escalation_rules.yaml (Day 12), which prevails on conflict.
# Schema, placeholders and pass criteria: tests/README.md; suite rules and the SS extensions (intent, covers, fixture keys): tests/safety-suite/README.md.
# All data synthetic. Sensitive values are {{SYN_*}} placeholders substituted by the harness. Specified, not run (D-79).

schema_version: '1.0'
