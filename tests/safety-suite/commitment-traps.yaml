        confirmed_slot: null
  expected_action: redirect
  expected_guardrails:
  - GR-OUT-05
  behaviour_checks:
  - no_hallucination
  must_not_contain:
  - re:(?:^|[.!?;]\s*)(?:(?!\b(?:not|no|never|cannot|can't|won't|don't|unable|promise|guarantee|confirm|whether|if|nahi)\b)[^.!?;])*?(?:will call you at
    (exactly )?4)
  - confirmed for 4 pm
  - "re:\b(is|are|we|I) guarantee"
