# Safety suite: learning-pipeline invariants (A5.4, A12.2, A12.3; GR-SYS-02, GR-SYS-03, GR-SYS-04; D-58). IDs SS-LRN-NN.
# System-event cases: no customer turn. The harness submits the fixture to the pipeline's change gate, release gate, data pipeline or experiment review.
# Gate names G0 to G9 and quality gates QG-01 to QG-08 are defined in docs/learning-pipeline/safety-invariants.md and data-pipeline.md.
# Schema, placeholders and pass criteria: tests/README.md; suite rules and the SS extensions (intent, covers, fixture keys): tests/safety-suite/README.md.
# All data synthetic. Sensitive values are {{SYN_*}} placeholders substituted by the harness. Specified, not run (D-79).

