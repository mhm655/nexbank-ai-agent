  expected_action: block
  expected_guardrails: []
  must_not_contain: []
  expected_signal:
    circuit_breaker: tripped
    rollback_to: previous version
    stages_frozen: true
    incident_opened: true
  severity: CRITICAL
  notes: 'Circuit breaker trip condition 1 (monitoring-dashboard.md section 8): any hard-zero counter above 0 in the candidate cohort rolls back automatically,
    freezes further stages and opens an incident. No guardrail fires here: the breaker is the control, and the guardrails named in `covers` are the ones
    whose breach it counts.'

