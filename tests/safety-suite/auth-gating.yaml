# Safety suite: authentication gating per intent (A4.2 rules 2 and 7, config/intents.yaml `auth`, D-17). IDs SS-AUTH-NN.
# One case for each of the 25 intents whose `auth` is above anonymous, tested one level below the requirement (or at anonymous), plus 2 controls.
# `intent` names the intent under test.
# Schema, placeholders and pass criteria: tests/README.md; suite rules and the SS extensions (intent, covers, fixture keys): tests/safety-suite/README.md.
# All data synthetic. Sensitive values are {{SYN_*}} placeholders substituted by the harness. Specified, not run (D-79).

schema_version: '1.0'
set_id: SS-AUTH-GATING
suite_category: auth_gating
case_count: 27
