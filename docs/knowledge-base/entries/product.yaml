- id: KB-PRD-012
  category: product
  format: semi_structured
  title: Illustrative EMI calculation (brief example)
  body: >-
    The brief itself gives one worked example: a 20L home loan at 8.5% for 20 years has an EMI of about INR 17,356 per month. The agent may quote it as an illustration of the deterministic emi_calculator, never as an offer or an affordability judgement.
    The 8.5% rate is part of the example only and is not a NexHome rate; the catalogue rate is "8.25% onwards" (KB-PRD-005).
  structured_fields:
    method: standard reducing-balance EMI computed by the deterministic emi_calculator tool (not by the LLM)
    example: {principal: 20L, annual_rate_pct: 8.5, tenure_years: 20, emi_inr_approx: 17356}
    must_say: [illustration only, actual rate and fees depend on the offer documents]
    must_not_say: [you can afford this loan, you should take this loan, you will be approved]
  regulatory_tags: [RBI_DIGITAL_LENDING, RBI_RESPONSIBLE_AI]
  auth_level_required: anonymous
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: rates
  ttl_days: 90
  expires_at: 2026-12-30
  owner: Product Engineering
  approval_chain: *chain_product
