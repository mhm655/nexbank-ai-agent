  escalation_triggers: [ESC-005]
  status: published

- id: KB-TRB-007
  category: troubleshooting
  format: semi_structured
  title: Locked out or forgot the password or PIN
  body: The customer cannot log in or has forgotten a credential. The agent never sets, reads or receives a password, PIN or CVV. It can only trigger a reset link to the registered contact after verification.
  structured_fields:
    steps:
      - ask which credential is affected (credential_type)
      - verify the customer at otp_verified
      - confirm explicitly, then trigger send_credential_reset_link to the registered channel only
      - tell the customer the link goes to their registered contact, and that no one from the bank will ask for the code or password
    never: [accept the new password in chat, send the link to a new address]
  regulatory_tags: [PCI_DSS, RBI_DIGITAL_PAYMENT_SECURITY]
  auth_level_required: anonymous
  audience: customer_facing
  version: 1.0.1
  effective_from: *eff
  ttl_class: faq_troubleshooting
  ttl_days: 120
  expires_at: 2027-01-29
  owner: Product Engineering
  approval_chain: *chain_trb
  source_ref: A3.3 (SEC-003); A4.2 (rules 1 and 5)
  languages: [en]
  intents: [SEC-003]
  status: published

- id: KB-TRB-008
  category: troubleshooting
  format: semi_structured
  title: Card was blocked and the customer wants it unblocked
  body: Unblocking a card is a step-up action. The agent confirms why the card was blocked and, if the block was after fraud, does not unblock it without a human.
  structured_fields:
    required_auth: biometric_verified
    confirmation: explicit
    steps:
      - ask why the card was blocked (block_reason)
      - if blocked after a fraud report, do not unblock; hand off to Fraud Investigation
      - otherwise step up to biometric_verified, summarise, and get an explicit yes
    never: [ask for the CVV, PIN or full card number]
    related_entries: [KB-POL-006]
  regulatory_tags: [PCI_DSS]
  auth_level_required: biometric_verified
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: faq_troubleshooting
  ttl_days: 120
  expires_at: 2027-01-29
  owner: Product Engineering
  approval_chain: *chain_trb
  source_ref: A3.3 (CRD-001); A4.2
  languages: [en]
  intents: [CRD-001]
  escalation_triggers: [ESC-001]
  status: published

- id: KB-TRB-009
  category: troubleshooting
  format: unstructured
  title: A lookup tool is not responding
  body: >-
    When a read tool such as transaction status times out or errors, retry once. If it still fails, tell the customer plainly that the information is not available right now, do not guess a value, and offer a technical-support handoff (ESC-014) or a callback.
    Write actions are never retried automatically and failures are reported honestly with no promise about the outcome. A cached figure is never presented as current.
  structured_fields: {}
  regulatory_tags: []
  auth_level_required: anonymous
  audience: agent_internal
  version: 1.0.0
  effective_from: *eff
  ttl_class: faq_troubleshooting
  ttl_days: 120
  expires_at: 2027-01-29
  owner: Product Engineering
  approval_chain: *chain_trb
  source_ref: A6 (ESC-014); docs/architecture/component-interfaces.md (Tool/Action Orchestrator)
  languages: [en]
  intents: [TXN-001, TXN-003, TXN-004, CMP-002]
  escalation_triggers: [ESC-014]
  status: published

- id: KB-TRB-010
  category: troubleshooting
  format: unstructured
  title: Statement did not arrive
  body: >-
    If a requested statement has not arrived, first confirm the request went to the registered email address. Statements are never sent to a new address in the same turn. If the customer wants a different address, the contact detail must be updated first through the secure flow with stronger authentication (ACC-003).
    Offer the in-app download as another option, or a new request with a different date range or format. Do not read out account details in chat.
  structured_fields: {}
  regulatory_tags: [DPDP_ACT, KYC_AML]
  auth_level_required: otp_verified
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: faq_troubleshooting
  ttl_days: 120
  expires_at: 2027-01-29
  owner: Product Engineering
