  source_ref: A3.2 (TXN-004); D-09
  languages: [en]
  intents: [TXN-004, TXN-001]
  escalation_triggers: [ESC-014]
  status: published

- id: KB-TRB-005
  category: troubleshooting
  format: semi_structured
  title: Unrecognised or duplicate charge - dispute or fraud?
  body: A customer reports a charge they do not recognise or a charge that appears twice. The first job is to tell a merchant error from fraud, because the routes differ.
  structured_fields:
    decision:
      - if the customer says they did not make the transaction and suspects misuse, treat it as SEC-001 and block the card first (KB-POL-006)
      - if the customer made the purchase but the amount, duplicate or merchant is wrong, treat it as TXN-002 and collect transaction_id, dispute_reason and amount
      - 'if it is unclear, ask one question "Did you make this purchase yourself?" (disambiguation pair 5)'
    escalation: ESC-005 when the dispute amount exceeds INR 50,000
    never: [accuse the customer, promise a refund or a date]
    tertiary: [unrecognised_charge, duplicate_charge, merchant_error, wrong_amount]
  regulatory_tags: [PCI_DSS, KYC_AML]
  auth_level_required: otp_verified
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: faq_troubleshooting
  ttl_days: 120
  expires_at: 2027-01-29
  owner: Product Engineering
  approval_chain: *chain_trb
  source_ref: A3.2 (TXN-002); A3.4; A6 (ESC-005)
  languages: [en]
  intents: [TXN-002, SEC-001, TXN-001]
  escalation_triggers: [ESC-005, ESC-001]
  status: published

- id: KB-TRB-006
  category: troubleshooting
  format: unstructured
  title: Refund not received
  body: >-
    A customer says a refund they were expecting has not arrived. Treat it as a dispute intake (TXN-002, refund_not_received). Collect the transaction reference, the reason and the amount, read what the system shows, and open a ticket after confirmation.
    State only the status or timeline that the system returns. If none is returned, say the team will review and update the customer. Never say that the refund will be credited by a date, and never say the dispute will be decided in the customer's favour.
    If the amount is above INR 50,000 the case also goes to the Dispute Resolution queue (ESC-005).
  structured_fields: {}
  regulatory_tags: [RBI_DIGITAL_PAYMENT_SECURITY]
  auth_level_required: otp_verified
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: faq_troubleshooting
