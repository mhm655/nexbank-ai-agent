# NexBank KB entries: category `troubleshooting` (11 entries). Schema: docs/knowledge-base/kb-schema.md
# Diagnostic guidance built from the taxonomy (config/intents.yaml) and A4.2. No settlement or reversal timelines appear here:
# a timeline may be quoted only if the status tool returns it in the same turn (D-09). Synthetic data only.

anchors:
  chain_trb: &chain_trb [Product Engineering, Customer Experience, Risk & Compliance]
  eff: &eff 2026-10-01

entries:

- id: KB-TRB-001
  category: troubleshooting
  format: semi_structured
  title: UPI payment debited but not credited
  body: The customer's account shows a debit but the beneficiary has not received the money. The agent reads the status, explains it plainly and opens a ticket. It cannot reverse or retry the payment.
  structured_fields:
    intent_tertiary: debited_not_credited
    collect: [upi_ref, beneficiary_name, amount, date]
    steps:
      - confirm the details with the customer and mask the account
      - call the transaction status tool once, with one retry on failure
      - if the tool returns a status, state it and any timeline the tool returns
      - if no timeline is returned, say the team will review and update the customer; promise no refund and no date
      - offer to open a ticket (soft confirmation)
    never: [reverse or retry the payment, promise recovery, ask for the PIN]
    on_tool_failure: KB-TRB-009
  regulatory_tags: [RBI_DIGITAL_PAYMENT_SECURITY]
  auth_level_required: otp_verified
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: faq_troubleshooting
  ttl_days: 120
  expires_at: 2027-01-29
  owner: Product Engineering
  approval_chain: *chain_trb
  source_ref: A3.2 (TXN-003); A4.2; D-09
  languages: [en]
  intents: [TXN-003, TXN-001]
  escalation_triggers: [ESC-014]
  status: published

- id: KB-TRB-002
  category: troubleshooting
  format: semi_structured
  title: UPI payment pending or declined
  body: A UPI payment shows pending or declined. The agent reads the status, tells the customer which state it is in, and does not retry the payment for them.
  structured_fields:
    intent_tertiary: [payment_pending, payment_declined]
    steps:
      - read the status with the tool and report it in plain words
      - for pending, do not state a clearing time unless the tool returns one
      - for declined, give the reason only if the tool returns one; do not guess
      - suggest the customer checks the details themselves before trying again (customer action, not an agent action)
      - offer a ticket if the status looks wrong to the customer
    never: [retry or reverse the payment, tell the customer the money is safe unless the tool says so]
  regulatory_tags: [RBI_DIGITAL_PAYMENT_SECURITY]
  auth_level_required: otp_verified
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: faq_troubleshooting
  ttl_days: 120
  expires_at: 2027-01-29
  owner: Product Engineering
  approval_chain: *chain_trb
  source_ref: A3.2 (TXN-003); D-09
  languages: [en]
  intents: [TXN-003]
  escalation_triggers: [ESC-014]
  status: published

- id: KB-TRB-003
  category: troubleshooting
  format: unstructured
  title: Money sent to the wrong beneficiary
  body: >-
    When a customer says they paid the wrong person, respond with empathy first. Explain that the bank cannot reverse a completed payment from this chat, and that a ticket can be opened so the team looks into it.
    Do not promise that the money will come back, and do not give a recovery timeline. Collect the reference, the beneficiary name, the amount and the date, then open the ticket after the customer confirms.
    If the customer thinks they were tricked into paying, treat it as a scam report and move to the fraud flow (KB-ESC-002).
  structured_fields: {}
  regulatory_tags: [RBI_DIGITAL_PAYMENT_SECURITY]
  auth_level_required: otp_verified
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: faq_troubleshooting
  ttl_days: 120
  expires_at: 2027-01-29
  owner: Product Engineering
  approval_chain: *chain_trb
  source_ref: A3.2 (TXN-003); A4.2 (rule 3); D-09
  languages: [en]
  intents: [TXN-003, SEC-001]
  escalation_triggers: [ESC-001]
  status: published

- id: KB-TRB-004
  category: troubleshooting
  format: semi_structured
  title: NEFT or RTGS status check
  body: The customer wants to know where an NEFT or RTGS transfer is. The agent needs the reference and the beneficiary bank, reads the status, and quotes timelines only if the tool returns them.
  structured_fields:
    intent_tertiary: [neft, rtgs]
    collect: [neft_ref, beneficiary_bank]
    optional: [amount, date]
    steps:
      - look up the status with the tool
      - report the status as returned and any timeline the tool returns
      - if nothing is found, check the reference with the customer once, then offer a ticket
    never: [state a general NEFT or RTGS settlement time, promise a credit time]
  regulatory_tags: [RBI_DIGITAL_PAYMENT_SECURITY]
  auth_level_required: otp_verified
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: faq_troubleshooting
  ttl_days: 120
