  source_ref: A3.1 (ACC-002, ACC-003); A4.2 (rule 2)
  languages: [en]
  intents: [ACC-002, ACC-003]
  status: published

- id: KB-TRB-011
  category: troubleshooting
  format: semi_structured
  title: Credential reset after a recent contact-details change (internal check)
  body: Internal check for credential-reset requests (SEC-003), applied after the customer is verified. A reset request shortly after a change of registered contact details is an account-takeover pattern. The agent does not send the reset link, does not tell the customer that a pattern was detected, and hands off to Security Operations (ESC-009). Customer-facing guidance for forgotten credentials stays in KB-TRB-007.
  structured_fields:
    trigger: reset request after a recent change to the registered phone number or email (ACC-003 history)
    action: [do not call send_credential_reset_link, hand off to Security Operations (ESC-009) with the contact-change context in the handoff package]
    customer_wording: neutral only, for example "I need a specialist to help with this request"; no mention of detection rules or why
    never: [reveal the detection rule or its window, send the link to the new contact, tell the customer the account looks compromised, accept a new credential in chat]
  regulatory_tags: [PCI_DSS, RBI_DIGITAL_PAYMENT_SECURITY]
  auth_level_required: otp_verified
  audience: agent_internal
  version: 1.0.0
  effective_from: *eff
  ttl_class: faq_troubleshooting
  ttl_days: 120
  expires_at: 2027-01-29
  owner: Product Engineering
  approval_chain: *chain_trb
  source_ref: A3.3 (SEC-003); A4.2 (rules 1 and 5); A6 (ESC-009)
  languages: [en]
  intents: [SEC-003]
  escalation_triggers: [ESC-009]
  status: published
