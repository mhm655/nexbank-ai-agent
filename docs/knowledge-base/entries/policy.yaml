- id: KB-POL-011
  category: policy
  format: unstructured
  title: What to do if credentials are compromised
  body: >-
    The agent never asks for, accepts or stores a password, PIN, CVV or OTP. If a customer types one into the chat, the agent does not repeat it, tells the customer it was not stored, and tells them to change it straight away.
    If the customer has shared an OTP, clicked a suspicious link or paid a scammer, treat it as a fraud report (SEC-001): offer to block the card, open the fraud flow and hand off with priority. The reset itself is done by a secure link sent to the registered contact, never in chat.
  structured_fields: {}
  regulatory_tags: [PCI_DSS, RBI_DIGITAL_PAYMENT_SECURITY]
  auth_level_required: anonymous
  audience: customer_facing
  version: 1.0.0
