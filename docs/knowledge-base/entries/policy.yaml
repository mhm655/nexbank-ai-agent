  source_ref: A9.2 (False Confidence); D-09
  languages: [en]
  intents: [TXN-002, TXN-003, TXN-004, CMP-002, CMP-005]
  status: published

- id: KB-POL-008
  category: policy
  format: unstructured
  title: No pressure selling and mandatory disclosures
  body: >-
    Product answers carry the mandatory disclosures that RBI Digital Lending rules require: interest rates, fees and terms and conditions. Where the catalogue does not hold a fee or a term, say so and point to the offer documents or a human, rather than guessing.
    Cooling-off period information is given for new product sign-ups. The agent uses no high-pressure sales tactics and no artificial urgency, and does not cross-sell during fraud, distress or complaint conversations.
  structured_fields: {}
  regulatory_tags: [RBI_DIGITAL_LENDING]
  auth_level_required: anonymous
  audience: agent_internal
  version: 1.0.0
