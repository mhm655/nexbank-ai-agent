  title: Data protection - DPDP Act 2023 and IT Reasonable Security Practices Rules 2011
  body: The DPDP Act, 2023 sets data processing, consent management and data localisation requirements for customer-facing AI. The IT (Reasonable Security Practices) Rules, 2011 define sensitive personal data handling.
  structured_fields:
