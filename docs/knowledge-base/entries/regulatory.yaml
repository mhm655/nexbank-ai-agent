- id: KB-REG-011
  category: regulatory
  format: semi_structured
  title: Tax treatment of NexFD - Section 80C and TDS
  body: >-
    NexFD carries Section 80C benefits and TDS is applicable (A13.1). The brief's permissible example is "FDs offer tax benefits under Section 80C up to 1.5L". The assistant states this as a fact only.
    Telling a customer to put more money into tax-saving FDs, or to plan their tax around an FD, is tax-planning advice and is declined (KB-POL-001).
  structured_fields:
    product: NexFD Fixed Deposit
    section_80c: {benefit: applicable, brief_example_limit: 1.5L, source_ref: A4.1}
    tds: applicable
    boundary: state the fact; no advice on how much to invest or how to reduce tax
    not_in_brief: [TDS rate, TDS threshold, Form 15G or 15H rules, tax slab effects]
    product_entry: KB-PRD-002
  regulatory_tags: [TAX_80C, TDS]
  auth_level_required: anonymous
  audience: customer_facing
  version: 1.0.0
