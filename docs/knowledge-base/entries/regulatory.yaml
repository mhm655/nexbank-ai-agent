- id: KB-REG-008
  category: regulatory
  format: unstructured
  title: RBI Master Direction on Digital Payment Security Controls (April 2024)
  body: >-
    The RBI Master Direction on Digital Payment Security Controls (April 2024) requires end-to-end encryption for all digital payment channels, including AI-assisted transactions. This entry states the regulatory requirement only.
    The assistant may state what the direction requires, and that it will never ask for a PIN, password, CVV or full card number. It does not confirm or describe how NexBank's own channels meet the requirement, and does not describe cipher suites or internal architecture; a question about NexBank's own implementation goes to the Compliance Helpdesk (ESC-008).
