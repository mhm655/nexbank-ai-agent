- id: KB-REG-001
  category: regulatory
  format: structured
  title: RBI Digital Lending Guidelines (September 2022)
  body: The RBI Digital Lending Guidelines (September 2022) require fair practices for AI/ML models, mandatory disclosures, cooling-off periods and no high-pressure tactics. For NexBank this means every loan or card answer carries the interest rate, fees and terms, and no pressure is applied.
  structured_fields:
    issuer: Reserve Bank of India
    instrument: Digital Lending Guidelines
    dated: September 2022
    obligations:
      - mandatory disclosures (interest rates, fees, T&C) in all product information
      - cooling-off period information for all new product sign-ups
      - grievance redressal information within 2 turns of any complaint
      - no high-pressure sales tactics or artificial urgency
    applies_to_products: [KB-PRD-003, KB-PRD-004, KB-PRD-005, KB-PRD-006]
    not_in_brief: [length of the cooling-off period, exact fee disclosure format, key fact statement layout]
  regulatory_tags: [RBI_DIGITAL_LENDING]
  auth_level_required: anonymous
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: regulatory
  ttl_days: 90
  expires_at: 2026-12-30
  owner: Regulatory Compliance Manager
  approval_chain: *chain_reg
  source_ref: A4.3; Appendix p71
  languages: [en]
  intents: [PRD-001, PRD-002, CRD-003, CRD-004]
  escalation_triggers: [ESC-008]
  status: published

- id: KB-REG-002
  category: regulatory
  format: structured
  title: Grievance redressal and the Banking Ombudsman Scheme
  body: Grievance redressal information must be available within 2 turns of any complaint. The brief cites the Banking Ombudsman Scheme, 2006 (amended 2017) of the Reserve Bank of India for this duty. The agent gives the grievance route early and does not state ombudsman timelines or contacts, which are not in the brief.
  structured_fields:
    issuer: Reserve Bank of India
    instrument: Banking Ombudsman Scheme, 2006 (amended 2017)
    rule: grievance redressal mechanism available within 2 turns of any complaint
    agent_behaviour:
      - after a complaint is detected, give the grievance route (register complaint, supervisor callback, escalation) by the second turn
      - empathy first, then the route (A9 Pattern 1)
    reporting: quarterly customer complaint analysis per Banking Ombudsman requirements
    not_in_brief: [ombudsman contact details, filing channels, time limits, award limits]
    gap_entry: KB-ESC-019
  regulatory_tags: [RBI_OMBUDSMAN, RBI_DIGITAL_LENDING]
  auth_level_required: anonymous
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: regulatory
  ttl_days: 90
  expires_at: 2026-12-30
  owner: Regulatory Compliance Manager
  approval_chain: *chain_reg
  source_ref: A4.3; Appendix p71; A10.3 (regulatory reporting)
  languages: [en]
  intents: [CMP-001, CMP-003, CMP-002]
  escalation_triggers: [ESC-008, ESC-002]
  status: published

- id: KB-REG-003
  category: regulatory
  format: semi_structured
  title: PCI DSS v4.0 - card data in conversations
  body: >-
    PCI DSS v4.0 governs payment card data handling in conversational interfaces: masking, encryption and logging. NexBank rules from A4.3 are: card numbers masked in display and logs (last 4 digits only), CVV or CVC never requested, stored or displayed, and enhanced audit logging for payment-related conversations.
  structured_fields:
    issuer: PCI SSC
    instrument: PCI DSS v4.0
    rules:
      masking: show only the last 4 digits of a card number in display and logging
      cvv_cvc: never request, store or display
      logging: enhanced audit logging for all payment-related conversations
    customer_wording: "If a customer offers a full card number or CVV, ask them not to share it and use the last 4 digits only."
    not_in_brief: [specific PCI DSS requirement numbers, scope assessment details]
  regulatory_tags: [PCI_DSS]
  auth_level_required: anonymous
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: regulatory
  ttl_days: 90
  expires_at: 2026-12-30
  owner: Regulatory Compliance Manager
  approval_chain: *chain_reg
  source_ref: A4.3; Appendix p71
  languages: [en]
  intents: [CRD-001, CRD-002, SEC-001, SEC-003]
  status: published

- id: KB-REG-004
  category: regulatory
  format: semi_structured
  title: KYC, AML and PEP requirements
  body: >-
    KYC/AML rules require identity verification before account-specific information is given, flagging of suspicious transaction patterns to the AML team, refusal of requests that could facilitate money laundering, and enhanced due diligence when a PEP flag is present.
    The agent never tells a customer that they are suspected of anything. It routes silently to AML Compliance (ESC-012) or Enhanced Due Diligence (ESC-015).
  structured_fields:
    rules:
      - verify customer identity before account-specific information
      - flag suspicious transaction patterns to the AML team
      - never process requests that could facilitate money laundering
      - PEP flags must trigger enhanced due diligence protocols
    routes:
      money_laundering_indicators: {trigger: ESC-012, priority: P0, queue: AML Compliance, sla: under 2 min}
      pep_customer: {trigger: ESC-015, priority: P1, queue: Enhanced Due Diligence, sla: under 5 min}
    products_with_kyc: [KB-PRD-001, KB-PRD-004, KB-PRD-008]
    not_in_brief: [AML thresholds, KYC document list, re-KYC periodicity]
  regulatory_tags: [KYC_AML]
  auth_level_required: anonymous
  audience: agent_internal
  version: 1.0.0
  effective_from: *eff
  ttl_class: regulatory
  ttl_days: 90
  expires_at: 2026-12-30
  owner: Regulatory Compliance Manager
  approval_chain: *chain_reg
  source_ref: A4.3; A6
  languages: [en]
  intents: [ACC-008, TXN-006, ACC-001]
  escalation_triggers: [ESC-012, ESC-015]
  status: published

- id: KB-REG-005
  category: regulatory
  format: unstructured
  title: SEBI robo-advisory guidelines (2024)
  body: >-
    The SEBI Guidelines on Robo-Advisory (2024) state that SEBI registration is required for personalised investment advice, and that information-only services are exempt.
    NexBank's assistant stays on the information side. It may describe NexInvest and NexGold facts, risk disclosure and how a SIP works as a general feature, and it declines to say which fund, amount or timing suits a customer. For personalised advice it offers a SEBI-registered advisor through the Wealth Advisory queue (ESC-013).
  structured_fields: {}
  regulatory_tags: [SEBI_ROBO_ADVISORY]
  auth_level_required: anonymous
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
