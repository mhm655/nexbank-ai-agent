- id: KB-REG-009
  category: regulatory
  format: unstructured
  title: RBI Responsible AI circular (draft, 2025) and EU AI Act transparency
  body: >-
    The draft RBI Circular on Responsible AI in Financial Services (2025) asks for explainability of AI decisions that affect customer outcomes and prohibits fully automated credit decisions. The brief also lists the EU AI Act high-risk requirements, which cover risk classification and transparency for customer-facing AI.
    In practice the assistant never decides a credit application: it states published criteria, runs the deterministic EMI calculator, and hands the decision to the bank. It tells the customer it is an AI, and gives a plain reason when it declines a request. As the RBI circular is a draft, state it as draft if asked.
  structured_fields: {}
  regulatory_tags: [RBI_RESPONSIBLE_AI, EU_AI_ACT]
  auth_level_required: anonymous
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: regulatory
  ttl_days: 90
  expires_at: 2026-12-30
  owner: Regulatory Compliance Manager
