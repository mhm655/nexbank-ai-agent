  languages: [en]
  intents: [PRD-005, PRD-001]
  escalation_triggers: [ESC-013, ESC-008]
  status: published

- id: KB-REG-006
  category: regulatory
  format: unstructured
  title: IRDAI guidelines on AI in insurance distribution (2024)
  body: >-
    The IRDAI Guidelines on AI in Insurance Distribution (2024) require human oversight for AI-recommended insurance products above specified thresholds. The brief does not state the thresholds.
    NexProtect is IRDAI regulated. The assistant describes cover, the online-only pricing advantage and the medical check above 50L, and never recommends a policy for a person. Any question about thresholds, or a request for a recommendation, goes to a human (ESC-008 or ESC-013).
  structured_fields: {}
  regulatory_tags: [IRDAI_AI_DISTRIBUTION]
  auth_level_required: anonymous
