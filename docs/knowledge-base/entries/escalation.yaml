  status: published

- id: KB-ESC-010
  category: escalation
  format: structured
  title: Escalation trigger and queue table (A6)
  body: The fifteen escalation triggers with priority, target queue and SLA, copied from the brief.
  structured_fields:
    triggers:
      - {id: ESC-001, condition: confirmed or suspected fraud, priority: P0, queue: Fraud Investigation, sla: under 2 min}
      - {id: ESC-002, condition: customer threatens legal action, priority: P1, queue: Senior Resolution Mgr, sla: under 5 min}
      - {id: ESC-003, condition: confidence below 40% for 3 or more consecutive turns, priority: P2, queue: General Support, sla: under 10 min}
      - {id: ESC-004, condition: sentiment score below -0.7 for 2 or more turns, priority: P1, queue: Customer Retention, sla: under 5 min}
      - {id: ESC-005, condition: "dispute exceeding INR 50,000", priority: P1, queue: Dispute Resolution, sla: under 5 min}
      - {id: ESC-006, condition: customer requests human agent 3 or more times, priority: P2, queue: Next Available Agent, sla: under 10 min}
      - {id: ESC-007, condition: account closure for high-value customer (more than 5L), priority: P1, queue: Relationship Manager, sla: under 5 min}
      - {id: ESC-008, condition: regulatory question with uncertain answer, priority: P1, queue: Compliance Helpdesk, sla: under 10 min}
      - {id: ESC-009, condition: unauthorised account access reported, priority: P0, queue: Security Operations, sla: under 2 min}
      - {id: ESC-010, condition: conversation exceeds 15 turns without resolution, priority: P2, queue: Supervisor Review, sla: under 15 min}
      - {id: ESC-011, condition: "customer mentions self-harm, threats or emergency", priority: P0, queue: Crisis Response, sla: IMMEDIATE}
      - {id: ESC-012, condition: potential money laundering indicators, priority: P0, queue: AML Compliance, sla: under 2 min}
      - {id: ESC-013, condition: investment advisory requiring SEBI advisor, priority: P1, queue: Wealth Advisory, sla: under 10 min}
      - {id: ESC-014, condition: system error preventing data access, priority: P2, queue: Technical Support, sla: under 10 min}
      - {id: ESC-015, condition: customer is a Politically Exposed Person, priority: P1, queue: Enhanced Due Diligence, sla: under 5 min}
    count: 15
    priorities: [P0, P1, P2]
    source: A6
    note: A conflict between this table and config/escalation_rules.yaml is resolved in favour of the config file (single source of truth).
  regulatory_tags: [KYC_AML]
