# NexBank KB entries: category `escalation` (21 entries). Schema: docs/knowledge-base/kb-schema.md
# KB-ESC-001..010: escalation procedures that restate A6 and the project decisions, so retrieval can ground handoff wording.
# KB-ESC-011..021: GAP-HANDLING entries (`gap_handling: true`). A13.1 and the regulatory text hold no data for these topics,
# so each entry says what is unknown, gives a safe statement, names adjacent facts that ARE known, and offers a human. No figure is invented.
# The authoritative trigger rules live in config/escalation_rules.yaml (Day 12); this file never overrides them.

anchors:
  chain_esc: &chain_esc [Customer Experience, Risk & Compliance, Chief Risk Officer]
  eff: &eff 2026-10-01

entries:

# ------------------------------------------------------------ escalation procedures

- id: KB-ESC-001
  category: escalation
  format: semi_structured
  title: Handoff package contents
  body: Every handoff to a human carries a package so the customer never has to repeat themselves. The package has eight elements (D-04).
  structured_fields:
    elements:
      - customer ID (pseudonymised)
      - auth level
      - intent history
      - entities collected
      - conversation summary
      - sentiment trajectory
      - actions already taken
      - escalation trigger and reason
    customer_wording: "I am passing you to a colleague with the full details, so you will not need to repeat yourself."
    never: [include full card number, CVV, PIN, full Aadhaar or password in the package]
    missing_fields: fill from state and flag the package as incomplete
  regulatory_tags: [DPDP_ACT, PCI_DSS]
  auth_level_required: anonymous
  audience: agent_internal
  version: 1.0.0
  effective_from: *eff
  ttl_class: escalation_procedure
  ttl_days: 365
  expires_at: 2027-10-01
  owner: Customer Experience
  approval_chain: *chain_esc
  source_ref: A6; D-04
  languages: [en]
  intents: [GEN-003, CMP-003, SEC-001, ACC-005]
  status: published

- id: KB-ESC-002
  category: escalation
  format: semi_structured
  title: Fraud report handling (P0)
  body: >-
    A confirmed or suspected fraud report is the highest-priority path. Empathy first, no marketing, short sentences. The report is accepted at any auth level, and protective actions run only at otp_verified or above and only after explicit confirmation (D-16).
  structured_fields:
    triggers: [ESC-001 confirmed or suspected fraud, ESC-009 unauthorised account access reported]
    priority: P0
    queues: {ESC-001: Fraud Investigation, ESC-009: Security Operations}
    sla: under 2 min
    steps:
      - acknowledge and reassure in one sentence
      - offer to block the card, with a summary and explicit yes (KB-POL-006)
      - if the customer is anonymous, run a fast OTP step; if OTP fails, hand off to a human at P0
      - create the fraud record and hand off with the package (KB-ESC-001)
      - tell the customer to change any compromised credential (KB-POL-011)
    never: [cross-sell, ask the customer to forward credentials as evidence, accuse the customer, promise a refund]
  regulatory_tags: [PCI_DSS, KYC_AML, RBI_DIGITAL_PAYMENT_SECURITY]
  auth_level_required: anonymous
  audience: agent_internal
  version: 1.0.0
  effective_from: *eff
  ttl_class: escalation_procedure
  ttl_days: 365
  expires_at: 2027-10-01
  owner: Customer Experience
  approval_chain: *chain_esc
  source_ref: A6 (ESC-001, ESC-009); A4.2 (rule 6); D-16
  languages: [en]
  intents: [SEC-001, SEC-004, SEC-002, CRD-001]
  escalation_triggers: [ESC-001, ESC-009]
  status: published

- id: KB-ESC-003
  category: escalation
  format: semi_structured
  title: Customer asks for a human agent
  body: A request for a human is honoured. It is counted, never stalled, and does not require the customer to explain why. A request for a human is honoured from the first explicit request, when the handoff is prepared and one concrete offer may be made; a second request proceeds with no counter-offer. ESC-006 is the brief's backstop at the third request, where the Next Available Agent queue is triggered.
  structured_fields:
    trigger: the first-request rule (D-117) from the first explicit request; ESC-006 (customer requests a human agent 3 or more times) as the brief's backstop
    priority: P2
    queue: Next Available Agent
    sla: under 10 min
    behaviour:
      - first_request - acknowledge the request and prepare the handoff at once; the reply may carry one concrete offer to finish the task now, and the handoff proceeds unless the customer takes it
      - second_request - proceed with the handoff with no counter-offer
      - increment human_request_count, including implicit requests such as "who can I talk to"
      - at 3 or more requests ESC-006 applies as the hard backstop, hand off at once, with no further questions
      - offer a callback request if no agent is free; the callback time is a request, not a guarantee
    never: [argue, ask the customer to justify the request, pretend to be human]
  regulatory_tags: [EU_AI_ACT]
  auth_level_required: anonymous
  audience: agent_internal
  version: 2.0.0
  effective_from: *eff
  ttl_class: escalation_procedure
  ttl_days: 365
  expires_at: 2027-10-01
  owner: Customer Experience
  approval_chain: *chain_esc
  source_ref: A6 (ESC-006); A3.3 (GEN-003)
  languages: [en]
  intents: [GEN-003, CMP-005]
  escalation_triggers: [ESC-006]
  status: published

- id: KB-ESC-004
  category: escalation
  format: unstructured
  title: Distress, self-harm or emergency disclosure
  body: >-
    If a customer mentions self-harm, threats or an emergency, stop the banking task at once. Respond with a calm, caring crisis message, encourage the customer to contact emergency services or someone they trust, and hand off to the Crisis Response queue immediately (ESC-011, P0).
    Do not continue the previous task in the same turn, do not offer products, and do not ask for account details. The Input Guard screens for this independently before NLU, and the safety-critical wording comes from pre-reviewed templates in the customer's language.
  structured_fields: {}
  regulatory_tags: []
  auth_level_required: anonymous
  audience: agent_internal
  version: 1.0.0
  effective_from: *eff
  ttl_class: escalation_procedure
  ttl_days: 365
  expires_at: 2027-10-01
  owner: Customer Experience
  approval_chain: *chain_esc
  source_ref: A6 (ESC-011); A3.3 (GEN-007)
  languages: [en]
  intents: [GEN-007]
  escalation_triggers: [ESC-011]
  status: published

- id: KB-ESC-005
  category: escalation
  format: semi_structured
  title: Legal threats and unresolved complaints
  body: A complaint that is repeated, unresolved, angry or legal in tone moves to a human. Empathy first, then the route. The grievance route is given within 2 turns of any complaint (KB-REG-002).
  structured_fields:
    triggers:
      ESC-002: {condition: customer threatens legal action, priority: P1, queue: Senior Resolution Mgr, sla: under 5 min}
      ESC-004: {condition: sentiment score below -0.7 for 2 or more turns, priority: P1, queue: Customer Retention, sla: under 5 min}
      ESC-010: {condition: conversation exceeds 15 turns without resolution, priority: P2, queue: Supervisor Review, sla: under 15 min}
    legal_threat_rule: on legal_threat escalate immediately; do not argue, admit liability or comment on the law
    never: [debate the complaint, promise an outcome]
  regulatory_tags: [RBI_OMBUDSMAN]
  auth_level_required: anonymous
  audience: agent_internal
  version: 1.0.0
  effective_from: *eff
  ttl_class: escalation_procedure
  ttl_days: 365
  expires_at: 2027-10-01
  owner: Customer Experience
  approval_chain: *chain_esc
  source_ref: A6 (ESC-002, ESC-004, ESC-010)
  languages: [en]
  intents: [CMP-001, CMP-003, CMP-005]
  escalation_triggers: [ESC-002, ESC-004, ESC-010]
  status: published

- id: KB-ESC-006
  category: escalation
  format: structured
  title: Dispute above INR 50,000
  body: A dispute with an amount above INR 50,000 goes to the Dispute Resolution queue as P1 with an SLA of under 5 minutes.
