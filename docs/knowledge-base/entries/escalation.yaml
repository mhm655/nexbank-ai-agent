# ------------------------------------------------------------ GAP handling (kb_gap topics: A13.1 has no data)

- id: KB-ESC-011
  category: escalation
  format: semi_structured
  title: GAP - Recurring deposit (RD) is not in the catalogue
  body: A13.1 lists no recurring deposit product. If a customer asks for RD rates or terms, the agent must not invent a product, a rate or a tenure.
  gap_handling: true
  gap_for: [PRD-003]
  structured_fields:
    unknown: [existence of an RD product, RD rate, RD tenure, RD minimum instalment]
    safe_statement: "I can't confirm a recurring deposit product from the information I have. I can tell you about NexFD, or connect you with a team member."
    known_adjacent_facts: [KB-PRD-002, KB-FAQ-008]
    offer: [explain NexFD, human handoff, callback request]
    never: [state any RD rate, say that NexBank offers or does not offer RD as a fact beyond "I can't confirm"]
  regulatory_tags: [RBI_DIGITAL_LENDING]
  auth_level_required: anonymous
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: escalation_procedure
  ttl_days: 365
  expires_at: 2027-10-01
  owner: Customer Experience
  approval_chain: *chain_esc
  source_ref: A13.1 (absence); config/intents.yaml PRD-003 kb_gap
  languages: [en]
  intents: [PRD-003]
  status: published

- id: KB-ESC-012
  category: escalation
  format: semi_structured
  title: GAP - Savings account variants and upgrade paths
  body: A13.1 holds one deposit account, NexSave Savings Account. There are no named variants, tiers or upgrade rules, so an upgrade or downgrade question can only be answered with what is known.
  gap_handling: true
  gap_for: [ACC-007]
  structured_fields:
    unknown: [other account types, upgrade eligibility, downgrade rules, charges for a change]
    safe_statement: "The only deposit account I have details for is NexSave Savings Account. I don't have information on other account types or changing between them, so I would suggest speaking to a team member."
    known_adjacent_facts: [KB-PRD-001]
    offer: [describe NexSave, human handoff]
    never: [name an account variant, state an eligibility rule or a charge]
  regulatory_tags: []
  auth_level_required: anonymous
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: escalation_procedure
  ttl_days: 365
  expires_at: 2027-10-01
  owner: Customer Experience
  approval_chain: *chain_esc
  source_ref: A13.1 (absence); config/intents.yaml ACC-007 kb_gap
  languages: [en]
  intents: [ACC-007]
  status: published

- id: KB-ESC-013
  category: escalation
  format: semi_structured
  title: GAP - EMI conversion fees and rates
  body: A13.1 has no EMI conversion fee, rate or tenure option for card transactions. The agent may show a deterministic EMI illustration but cannot state conversion charges and cannot execute a conversion.
  gap_handling: true
  gap_for: [CRD-004]
  structured_fields:
    unknown: [conversion fee, interest rate on conversion, available tenures, eligibility]
    safe_statement: "I don't have the fees or rates for converting a purchase to EMI. I can show you an illustrative EMI calculation, or connect you with a team member for the exact terms."
    known_adjacent_facts: [KB-PRD-012]
    offer: [emi_calculator illustration with a customer-supplied rate marked as illustrative, in-app flow link, human handoff]
    never: [state a conversion fee or rate, execute the conversion, say the customer is eligible]
  regulatory_tags: [RBI_DIGITAL_LENDING]
  auth_level_required: anonymous
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: escalation_procedure
