  languages: [en]
  intents: [CRD-004]
  status: published

- id: KB-ESC-014
  category: escalation
  format: semi_structured
  title: GAP - FD rates for a specific tenure
  body: A13.1 gives NexFD only a rate range across its tenure span, and the brief's one tenure example is the A4.1 illustration; both are held in KB-PRD-002. Every other tenure-specific rate is unknown. This gap entry holds no rate itself, so a hard-expired rate entry is never re-served through the gap path (TTL rules in kb-schema.md).
  gap_handling: true
  gap_for: [PRD-003]
  structured_fields:
    unknown: [rate for any other tenure, senior-citizen rate, rate by deposit size, compounding or payout]
    safe_statement: "NexFD rates vary by tenure, and I don't have the rate for that exact tenure. I can share the published range, or a team member can confirm the rate for you."
    known_adjacent_facts: [KB-PRD-002, KB-FAQ-008, KB-REG-011]
    offer: [state the range and the A4.1 example from KB-PRD-002 while it is live, human handoff, callback request]
    never: [interpolate a rate for the customer's tenure, say which tenure is better]
  regulatory_tags: [RBI_DIGITAL_LENDING, TAX_80C]
  auth_level_required: anonymous
  audience: customer_facing
