- id: KB-ESC-020
  category: escalation
  format: unstructured
  title: GAP - Unknown or unsupported question (graceful degradation)
  body: >-
    When no KB entry is relevant, or retrieval confidence is below the threshold, do not fill the gap with a plausible answer. Acknowledge that you do not have the information, say what you do know that is nearby, and offer a clear next step: a clarifying question if one would help, a human handoff, or a callback request.
    A sample shape is: "I don't have reliable information on that, and I don't want to guess. I can tell you about [nearby topic], or connect you with a team member who can confirm it." Keep it short, warm and free of any number that is not in the KB.
    For a regulatory question the next step is the Compliance Helpdesk (ESC-008). After two failed clarifications, apply the safe default or offer a human (max_clarification_turns); after three consecutive turns below the ESC-003 confidence floor, escalate to General Support (ESC-003, D-06). Never invent a policy, rate, fee, limit, branch, regulation or timeline to avoid saying "I don't know".
  structured_fields: {}
  regulatory_tags: [RBI_RESPONSIBLE_AI]
  auth_level_required: anonymous
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: escalation_procedure
  ttl_days: 365
  expires_at: 2027-10-01
  owner: Customer Experience
  approval_chain: *chain_esc
  source_ref: A2.3 (graceful fallback); A6 (ESC-003, ESC-008); D-06
  languages: [en]
  intents: [GEN-004, PRD-001, GEN-008, PRD-003, ACC-007, CRD-004]
  escalation_triggers: [ESC-003, ESC-008]
  gap_handling: true
  gap_for: [GEN-004]
  status: published

