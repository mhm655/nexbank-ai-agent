  title: How do I get my account statement?
  body: A statement request needs otp_verified. Defaults are the last 30 days, PDF, sent to the registered email only. The assistant never sends a statement to a new email address in the same turn.
  structured_fields:
    required_auth: otp_verified
    defaults: {date_range: last 30 days, format: PDF, destination: registered email only}
    options: [in-app download, email statement, mini statement of last N transactions, interest certificate]
    never: [send to an unverified new address, include full account number in chat]
