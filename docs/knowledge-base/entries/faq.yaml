- id: KB-FAQ-008
  category: faq
  format: unstructured
  title: What tenure and tax treatment does NexFD have?
  body: >-
    NexFD tenures run from 7 days to 10 years, with rates in the range of 6.0 to 7.25 percent. Section 80C benefits are listed for it and TDS is applicable.
    I do not hold a tenure-by-tenure rate table, so for a specific tenure I would connect you with a team member.
  body_i18n:
    hi: NexFD की अवधि 7 दिन से 10 वर्ष तक है और दरें 6.0 से 7.25 प्रतिशत के दायरे में हैं। Section 80C लाभ लागू हैं और TDS लागू होता है। किसी खास अवधि की दर के लिए आपको हमारी टीम से जोड़ा जा सकता है।
    hinglish: NexFD ki tenure 7 din se 10 saal tak hai aur rates 6.0 se 7.25 percent ke range mein hain. Section 80C benefits milte hain aur TDS applicable hai. Kisi specific tenure ke rate ke liye aapko team se connect kiya ja sakta hai.
  structured_fields: {}
  regulatory_tags: [TAX_80C, TDS]
  auth_level_required: anonymous
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: rates
