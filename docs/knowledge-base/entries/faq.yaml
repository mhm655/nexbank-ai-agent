- id: KB-FAQ-004
  category: faq
  format: unstructured
  title: Is NexProtect regulated, and when is a medical check needed?
  body: >-
    NexProtect Term Insurance is IRDAI regulated. A medical check applies for cover above 50L, and cover goes up to 1 Cr. It also has an online-only pricing advantage.
    I can share these facts, but I cannot say whether a particular cover amount is right for you.
