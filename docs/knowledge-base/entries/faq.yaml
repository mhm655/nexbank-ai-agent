- id: KB-FAQ-001
  category: faq
  format: unstructured
  title: Is my NexSave deposit insured?
  body: >-
    Yes, within limits. NexSave Savings Account deposits have DICGC cover up to 5L, as listed in the NexBank product catalogue.
    For anything beyond that figure, such as how the cover is counted, I would need to connect you with a team member.
  body_i18n:
    hi: NexSave बचत खाते की जमा राशि पर DICGC कवर 5 लाख रुपये तक उपलब्ध है, जैसा कि NexBank की उत्पाद सूची में दिया गया है। इससे आगे की जानकारी के लिए आपको हमारी टीम से जोड़ा जा सकता है।
    hinglish: NexSave Savings Account ki deposit par DICGC cover 5L tak hai, jaisa NexBank product catalogue mein diya gaya hai. Isse aage ki jaankari ke liye aapko team se connect kiya ja sakta hai.
  structured_fields: {}
  regulatory_tags: [DICGC]
  auth_level_required: anonymous
  audience: customer_facing
