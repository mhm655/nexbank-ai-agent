- id: KB-FAQ-005
  category: faq
  format: semi_structured
  title: Loan eligibility quick answers
  body: Published criteria for the two NexBank loans. These are the stated requirements, not an approval decision, and the assistant never says a customer will be approved.
  structured_fields:
    qa:
      - q: What do I need for a NexHome Loan?
        a: CIBIL above 700, property valuation and a legal check. The loan starts at 8.25%, runs up to 30 years and goes up to 90% LTV.
      - q: What do I need for a NexPersonal Loan?
        a: CIBIL above 650 and income verification. The loan starts at 10.5%, runs up to 5 years and has instant disbursal.
      - q: Will I get the loan?
        a: I cannot decide that. The bank assesses each application against the criteria above.
    entries: [KB-PRD-005, KB-PRD-006]
  regulatory_tags: [RBI_DIGITAL_LENDING, RBI_RESPONSIBLE_AI]
  auth_level_required: anonymous
  audience: customer_facing
  version: 1.0.0
  effective_from: *eff
  ttl_class: rates
  ttl_days: 90
  expires_at: 2026-12-30
  owner: Customer Experience
  approval_chain: *chain_faq
  source_ref: A13.1
  languages: [en]
  intents: [PRD-002]
  status: published

