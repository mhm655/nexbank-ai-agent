  status: published

- id: KB-FAQ-002
  category: faq
  format: unstructured
  title: Do I need a minimum balance in NexSave?
  body: >-
    No. NexSave Savings Account is a zero balance account, so there is no minimum balance to maintain. It also gives instant UPI, and KYC is mandatory to open it.
  body_i18n:
    hi: NexSave बचत खाता जीरो बैलेंस खाता है। इसमें तुरंत UPI की सुविधा मिलती है और खाते के लिए KYC अनिवार्य है।
    hinglish: NexSave Savings Account zero balance account hai. Isme instant UPI milta hai aur KYC mandatory hai.
  structured_fields: {}
